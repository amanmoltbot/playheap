<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Icon -->
  <circle cx="40" cy="40" r="36" fill="url(#bg2)"/>
  <circle cx="40" cy="40" r="36" stroke="#7c3aed" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Controller body -->
  <rect x="14" y="28" width="52" height="24" rx="12" fill="url(#body2)"/>

  <!-- D-pad -->
  <rect x="19" y="36" width="12" height="4" rx="2" fill="#c4b5fd" opacity="0.9"/>
  <rect x="23" y="32" width="4" height="12" rx="2" fill="#c4b5fd" opacity="0.9"/>

  <!-- Buttons -->
  <circle cx="56" cy="35" r="3" fill="#f472b6" opacity="0.9"/>
  <circle cx="63" cy="40" r="3" fill="#facc15" opacity="0.9"/>
  <circle cx="56" cy="45" r="3" fill="#34d399" opacity="0.9"/>
  <circle cx="49" cy="40" r="3" fill="#60a5fa" opacity="0.9"/>

  <!-- Center buttons -->
  <rect x="35" y="38" width="5" height="4" rx="2" fill="#6d28d9" opacity="0.9"/>
  <rect x="42" y="38" width="5" height="4" rx="2" fill="#6d28d9" opacity="0.9"/>

  <!-- Shoulder bumpers -->
  <rect x="19" y="22" width="15" height="7" rx="3.5" fill="url(#shoulder2)" opacity="0.85"/>
  <rect x="46" y="22" width="15" height="7" rx="3.5" fill="url(#shoulder2)" opacity="0.85"/>

  <!-- Text: ArcadeHeap -->
  <text x="90" y="44" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="800" font-size="32" fill="white" letter-spacing="-0.5">Arcade</text>
  <text x="90" y="44" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="800" font-size="32" fill="white" letter-spacing="-0.5" x="90">
    <tspan fill="white">Arcade</tspan><tspan fill="#8b5cf6">Heap</tspan>
  </text>

  <defs>
    <radialGradient id="bg2" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#1e1040"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <linearGradient id="body2" x1="14" y1="28" x2="66" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="shoulder2" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
</svg>
