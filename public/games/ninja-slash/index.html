<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ninja Slash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f0f0f; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; touch-action: none; cursor: crosshair; border-radius: 8px; }
  #ui { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const s = Math.min(window.innerWidth, window.innerHeight, 600);
  canvas.width = s; canvas.height = s;
}
resize();
window.addEventListener('resize', resize);

const STATE = { MENU: 0, PLAY: 1, OVER: 2 };
let state = STATE.MENU;
let score = 0, combo = 0, comboTimer = 0, lives = 3, wave = 1, spawnRate = 90, spawnTimer = 0;
let enemies = [], slashTrail = [], particles = [];

class Enemy {
  constructor() {
    const side = Math.floor(Math.random() * 4);
    const W = canvas.width;
    if (side === 0) { this.x = Math.random() * W; this.y = -40; }
    else if (side === 1) { this.x = W + 40; this.y = Math.random() * W; }
    else if (side === 2) { this.x = Math.random() * W; this.y = W + 40; }
    else { this.x = -40; this.y = Math.random() * W; }
    this.cx = W / 2; this.cy = W / 2;
    const speed = 0.8 + wave * 0.15 + Math.random() * 0.4;
    const dx = this.cx - this.x, dy = this.cy - this.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    this.vx = dx/dist*speed; this.vy = dy/dist*speed;
    this.r = 22 + Math.random() * 10;
    this.hp = 1;
    this.angle = Math.random() * Math.PI * 2;
    this.hue = Math.random() < 0.3 ? 0 : (Math.random() < 0.5 ? 200 : 270);
    this.alive = true;
    this.shakeTimer = 0;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.angle += 0.05;
    if (this.shakeTimer > 0) this.shakeTimer--;
    const W = canvas.width;
    const dx = this.x - W/2, dy = this.y - W/2;
    if (Math.sqrt(dx*dx+dy*dy) < 30) { this.alive = false; lives--; spawnParticles(this.x, this.y, '#ff3333', 8); }
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    // Body
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * 4 * Math.PI / 5) - Math.PI/2;
      const r = i % 2 === 0 ? this.r : this.r * 0.45;
      i === 0 ? ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r) : ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.closePath();
    const c = this.hue === 0 ? '#cc2222' : (this.hue === 200 ? '#2255cc' : '#8b5cf6');
    ctx.fillStyle = c;
    ctx.shadowColor = c;
    ctx.shadowBlur = 12;
    ctx.fill();
    // Eye
    ctx.beginPath();
    ctx.arc(0, -4, 5, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(1, -4, 2.5, 0, Math.PI*2);
    ctx.fillStyle = '#000';
    ctx.fill();
    ctx.restore();
  }
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 30, color });
  }
}

function checkSlash(x1,y1,x2,y2) {
  let hit = false;
  enemies.forEach(e => {
    if (!e.alive) return;
    // Line-circle intersection
    const dx = x2-x1, dy = y2-y1;
    const fx = x1-e.x, fy = y1-e.y;
    const a = dx*dx+dy*dy;
    const b = 2*(fx*dx+fy*dy);
    const c2 = fx*fx+fy*fy - e.r*e.r;
    const disc = b*b - 4*a*c2;
    if (disc >= 0) {
      e.alive = false; hit = true;
      combo++; comboTimer = 90;
      const mult = Math.min(combo, 5);
      score += 10 * mult;
      spawnParticles(e.x, e.y, '#8b5cf6', 12);
    }
  });
  return hit;
}

let mouseDown = false, lastMX = 0, lastMY = 0;

function getPos(evt) {
  const r = canvas.getBoundingClientRect();
  const scale = canvas.width / r.width;
  if (evt.touches) {
    return { x: (evt.touches[0].clientX - r.left) * scale, y: (evt.touches[0].clientY - r.top) * scale };
  }
  return { x: (evt.clientX - r.left) * scale, y: (evt.clientY - r.top) * scale };
}

canvas.addEventListener('mousedown', e => { mouseDown = true; const p = getPos(e); lastMX = p.x; lastMY = p.y; });
canvas.addEventListener('mousemove', e => {
  if (!mouseDown || state !== STATE.PLAY) return;
  const p = getPos(e);
  slashTrail.push({ x1: lastMX, y1: lastMY, x2: p.x, y2: p.y, life: 8 });
  checkSlash(lastMX, lastMY, p.x, p.y);
  lastMX = p.x; lastMY = p.y;
});
canvas.addEventListener('mouseup', () => mouseDown = false);
canvas.addEventListener('touchstart', e => { e.preventDefault(); mouseDown = true; const p = getPos(e); lastMX = p.x; lastMY = p.y; });
canvas.addEventListener('touchmove', e => {
  e.preventDefault(); if (state !== STATE.PLAY) return;
  const p = getPos(e);
  slashTrail.push({ x1: lastMX, y1: lastMY, x2: p.x, y2: p.y, life: 8 });
  checkSlash(lastMX, lastMY, p.x, p.y);
  lastMX = p.x; lastMY = p.y;
});
canvas.addEventListener('touchend', () => mouseDown = false);

canvas.addEventListener('click', e => {
  if (state === STATE.MENU || state === STATE.OVER) startGame();
});

function startGame() {
  state = STATE.PLAY; score = 0; combo = 0; comboTimer = 0; lives = 3; wave = 1;
  spawnRate = 90; spawnTimer = 0; enemies = []; particles = []; slashTrail = [];
}

let frameCount = 0;
function loop() {
  requestAnimationFrame(loop);
  const W = canvas.width;
  ctx.clearRect(0, 0, W, W);

  // BG
  ctx.fillStyle = '#0f0f0f';
  ctx.fillRect(0, 0, W, W);

  // Center zone
  ctx.beginPath();
  ctx.arc(W/2, W/2, 30, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(139,92,246,0.15)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(139,92,246,0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = 'rgba(139,92,246,0.7)';
  ctx.font = `bold ${W*0.04}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('⚡', W/2, W/2);

  if (state === STATE.MENU) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, W);
    ctx.fillStyle = '#8b5cf6';
    ctx.font = `bold ${W*0.1}px sans-serif`;
    ctx.fillText('NINJA SLASH', W/2, W*0.35);
    ctx.fillStyle = '#ccc';
    ctx.font = `${W*0.05}px sans-serif`;
    ctx.fillText('Slash enemies before they', W/2, W*0.5);
    ctx.fillText('reach the center!', W/2, W*0.57);
    ctx.fillStyle = '#8b5cf6';
    ctx.font = `bold ${W*0.06}px sans-serif`;
    ctx.fillText('TAP TO START', W/2, W*0.72);
    return;
  }

  if (state === STATE.OVER) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, W, W);
    ctx.fillStyle = '#ff4444';
    ctx.font = `bold ${W*0.1}px sans-serif`;
    ctx.fillText('GAME OVER', W/2, W*0.35);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${W*0.07}px sans-serif`;
    ctx.fillText(`Score: ${score}`, W/2, W*0.5);
    ctx.fillStyle = '#8b5cf6';
    ctx.font = `bold ${W*0.06}px sans-serif`;
    ctx.fillText('TAP TO RESTART', W/2, W*0.67);
    return;
  }

  frameCount++;

  // Wave progression
  if (frameCount % 600 === 0) { wave++; spawnRate = Math.max(30, spawnRate - 5); }

  // Spawn
  spawnTimer++;
  if (spawnTimer >= spawnRate) { spawnTimer = 0; enemies.push(new Enemy()); }

  // Combo timer
  if (comboTimer > 0) { comboTimer--; if (comboTimer === 0) combo = 0; }

  // Update
  enemies.forEach(e => e.update());
  enemies = enemies.filter(e => e.alive);
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= 0.9; p.vy *= 0.9; p.life--; });
  particles = particles.filter(p => p.life > 0);

  // Draw enemies
  enemies.forEach(e => e.draw());

  // Draw particles
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 30;
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  // Slash trail
  slashTrail.forEach(s => {
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.strokeStyle = `rgba(139,92,246,${s.life/8})`;
    ctx.lineWidth = 3 * (s.life/8);
    ctx.lineCap = 'round';
    ctx.stroke();
    s.life--;
  });
  slashTrail = slashTrail.filter(s => s.life > 0);

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${W*0.045}px sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillText(`Score: ${score}`, W*0.04, W*0.07);
  ctx.textAlign = 'right';
  ctx.fillText(`Wave ${wave}`, W*0.96, W*0.07);
  ctx.textAlign = 'center';
  // Lives
  let livesStr = '';
  for (let i = 0; i < lives; i++) livesStr += '❤️';
  for (let i = lives; i < 3; i++) livesStr += '🖤';
  ctx.font = `${W*0.04}px sans-serif`;
  ctx.fillText(livesStr, W/2, W*0.06);

  // Combo
  if (combo > 1) {
    ctx.fillStyle = '#f59e0b';
    ctx.font = `bold ${W*0.07}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(`x${combo} COMBO!`, W/2, W*0.88);
  }

  if (lives <= 0) state = STATE.OVER;
}

loop();
</script>
<script>
/* ArcadeHeap Ad Placement API bridge */
(function(){
  if(window.parent===window)return;
  function requestAd(t){
    window.parent.postMessage({type:"adBreak",breakType:t||"next"},"*");
  }
  window.ahRequestAd=requestAd;
  var origAlert=window.alert;
  window.alert=function(msg){
    if(/game over|you win|you lose|congratulations|well done/i.test(msg)){
      requestAd("next");
    }
    return origAlert.apply(this,arguments);
  };
})();
</script>
</body>
</html>
