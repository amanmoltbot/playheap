<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: #e0e0e0;
  }
  h1 { font-size: 2rem; color: #7c3aed; margin-bottom: 8px; letter-spacing: 2px; }
  #score-board {
    display: flex;
    gap: 40px;
    margin-bottom: 16px;
    font-size: 1rem;
    color: #a0a0c0;
  }
  #score-board span { color: #c084fc; font-weight: bold; font-size: 1.2rem; }
  canvas {
    border: 2px solid #3b0764;
    border-radius: 8px;
    background: #13131f;
    box-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
  }
  #overlay {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(15, 15, 26, 0.92);
    border-radius: 8px;
    padding: 30px 50px;
    text-align: center;
  }
  #overlay h2 { font-size: 1.8rem; color: #c084fc; margin-bottom: 12px; }
  #overlay p { color: #a0a0c0; margin-bottom: 20px; font-size: 0.95rem; }
  #overlay button {
    background: #7c3aed;
    color: white;
    border: none;
    padding: 12px 32px;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  #overlay button:hover { background: #6d28d9; }
  #controls { margin-top: 14px; color: #666; font-size: 0.8rem; }
  .wrap { position: relative; }
</style>
</head>
<body>
<h1>🐍 SNAKE</h1>
<div id="score-board">Score: <span id="score">0</span> &nbsp;|&nbsp; Best: <span id="best">0</span></div>
<div class="wrap">
  <canvas id="c" width="400" height="400"></canvas>
  <div id="overlay">
    <h2>SNAKE</h2>
    <p>Use arrow keys to control the snake.<br>Eat food to grow. Don't hit walls or yourself!</p>
    <button onclick="startGame()">▶ Start Game</button>
  </div>
</div>
<div id="controls">Arrow Keys / WASD to move &nbsp;|&nbsp; P to pause</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

let snake, dir, nextDir, food, score, best = 0, running = false, paused = false, raf;

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  updateScore();
  spawnFood();
  running = true;
  paused = false;
  clearInterval(raf);
  raf = setInterval(tick, 120);
}

function spawnFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function tick() {
  if (paused) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
  if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    if (score > best) best = score;
    updateScore();
    spawnFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#13131f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Grid
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) { ctx.beginPath(); ctx.moveTo(x*GRID,0); ctx.lineTo(x*GRID,canvas.height); ctx.stroke(); }
  for (let y = 0; y <= ROWS; y++) { ctx.beginPath(); ctx.moveTo(0,y*GRID); ctx.lineTo(canvas.width,y*GRID); ctx.stroke(); }
  // Food
  const fx = food.x * GRID, fy = food.y * GRID;
  ctx.fillStyle = '#f43f5e';
  ctx.shadowBlur = 12;
  ctx.shadowColor = '#f43f5e';
  ctx.fillRect(fx+2, fy+2, GRID-4, GRID-4);
  ctx.shadowBlur = 0;
  // Snake
  snake.forEach((seg, i) => {
    const brightness = i === 0 ? 1 : Math.max(0.4, 1 - i / snake.length * 0.6);
    ctx.fillStyle = i === 0 ? '#7c3aed' : `rgba(124, 58, 237, ${brightness})`;
    ctx.fillRect(seg.x*GRID+1, seg.y*GRID+1, GRID-2, GRID-2);
    if (i === 0) {
      ctx.fillStyle = '#c084fc';
      const ex = dir.x, ey = dir.y;
      const eyeOffsets = [{ dx: -ey*3+ex*5, dy: ex*3+ey*5 }, { dx: ey*3+ex*5, dy: -ex*3+ey*5 }];
      eyeOffsets.forEach(e => {
        ctx.beginPath();
        ctx.arc(seg.x*GRID+GRID/2+e.dx, seg.y*GRID+GRID/2+e.dy, 2, 0, Math.PI*2);
        ctx.fill();
      });
    }
  });
}

function gameOver() {
  if(window.ahRequestAd)window.ahRequestAd("next");
  if (window.parent !== window) { window.parent.postMessage({ type: "adBreak", breakType: "next" }, "*"); }
  clearInterval(raf);
  running = false;
  const ov = document.getElementById('overlay');
  ov.innerHTML = `<h2>GAME OVER</h2><p>Score: <strong>${score}</strong><br>Best: <strong>${best}</strong></p><button onclick="startGame()">▶ Play Again</button>`;
  ov.style.display = 'flex';
}

function updateScore() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
}

document.addEventListener('keydown', e => {
  switch(e.key) {
    case 'ArrowUp': case 'w': case 'W': if(dir.y !== 1) nextDir = {x:0,y:-1}; break;
    case 'ArrowDown': case 's': case 'S': if(dir.y !== -1) nextDir = {x:0,y:1}; break;
    case 'ArrowLeft': case 'a': case 'A': if(dir.x !== 1) nextDir = {x:-1,y:0}; break;
    case 'ArrowRight': case 'd': case 'D': if(dir.x !== -1) nextDir = {x:1,y:0}; break;
    case 'p': case 'P': paused = !paused; break;
  }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});

// Touch swipe support
let touchX = null, touchY = null;
document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && dir.x !== -1) nextDir = {x:1,y:0};
    else if (dx < 0 && dir.x !== 1) nextDir = {x:-1,y:0};
  } else {
    if (dy > 0 && dir.y !== -1) nextDir = {x:0,y:1};
    else if (dy < 0 && dir.y !== 1) nextDir = {x:0,y:-1};
  }
  touchX = null; touchY = null;
}, {passive:true});
</script>
<script>
/* ArcadeHeap Ad Placement API bridge */
(function(){
  if(window.parent===window)return;
  function requestAd(t){
    window.parent.postMessage({type:"adBreak",breakType:t||"next"},"*");
  }
  window.ahRequestAd=requestAd;
  var origAlert=window.alert;
  window.alert=function(msg){
    if(/game over|you win|you lose|congratulations|well done/i.test(msg)){
      requestAd("next");
    }
    return origAlert.apply(this,arguments);
  };
})();
</script>
</body>
</html>
