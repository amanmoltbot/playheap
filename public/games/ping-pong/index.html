<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ping Pong</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f0f0f; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = Math.min(window.innerWidth, 640);
const H = Math.min(window.innerHeight, 480);
canvas.width = W; canvas.height = H;

const STATE = { MENU: 0, PLAY: 1, OVER: 2 };
let state = STATE.MENU;
const PADDLE_W = 12, PADDLE_H = 70, BALL_R = 8;
const MAX_SCORE = 7;
let ball, p1, p2, scoreL, scoreR, keys = {}, particles = [], aiMode = true;

function initGame() {
  p1 = { x: 20, y: H/2-PADDLE_H/2, dy: 0 };
  p2 = { x: W-20-PADDLE_W, y: H/2-PADDLE_H/2, dy: 0 };
  resetBall(); scoreL = 0; scoreR = 0; particles = [];
  state = STATE.PLAY;
}

function resetBall(dir = 0) {
  const angle = (Math.random()*0.8 - 0.4);
  const speed = 5;
  const d = dir || (Math.random() < 0.5 ? 1 : -1);
  ball = { x: W/2, y: H/2, vx: d*speed*Math.cos(angle), vy: speed*Math.sin(angle), speed: 5 };
}

function spawnParticles(x, y, color) {
  for (let i=0; i<8; i++) {
    const a = Math.random()*Math.PI*2, s = 2+Math.random()*3;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 20, color });
  }
}

function drawPaddle(paddle, color) {
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, PADDLE_W, PADDLE_H, 4);
  ctx.fill();
  ctx.shadowBlur = 0;
}

document.addEventListener('keydown', e => { keys[e.key] = true; if (state !== STATE.PLAY) initGame(); });
document.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('click', () => { if (state !== STATE.PLAY) initGame(); });

function aiUpdate() {
  const center = p2.y + PADDLE_H/2;
  const diff = ball.y - center;
  const aiSpeed = Math.min(4.5, Math.abs(diff)) * Math.sign(diff);
  p2.y = Math.max(0, Math.min(H - PADDLE_H, p2.y + aiSpeed));
}

function loop() {
  requestAnimationFrame(loop);
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, 0, W, H);

  // Center dashed line
  ctx.setLineDash([10, 10]);
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.setLineDash([]);

  if (state === STATE.MENU) {
    ctx.fillStyle = '#38bdf8';
    ctx.font = `bold ${W*0.1}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('PING PONG', W/2, H*0.3);
    ctx.fillStyle = '#aaa';
    ctx.font = `${W*0.047}px sans-serif`;
    ctx.fillText('W/S = Left paddle', W/2, H*0.48);
    ctx.fillText('↑/↓ = Right paddle', W/2, H*0.56);
    ctx.fillText(`First to ${MAX_SCORE} wins!`, W/2, H*0.64);
    ctx.fillStyle = '#38bdf8';
    ctx.font = `bold ${W*0.065}px sans-serif`;
    ctx.fillText('CLICK TO START', W/2, H*0.8);
    return;
  }

  if (state === STATE.OVER) {
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,W,H);
    const winner = scoreL >= MAX_SCORE ? 'PLAYER 1 WINS!' : 'PLAYER 2 WINS!';
    ctx.fillStyle = '#38bdf8'; ctx.font = `bold ${W*0.1}px sans-serif`;
    ctx.textAlign = 'center'; ctx.fillText(winner, W/2, H*0.38);
    ctx.fillStyle = '#fff'; ctx.font = `bold ${W*0.08}px sans-serif`;
    ctx.fillText(`${scoreL} — ${scoreR}`, W/2, H*0.55);
    ctx.fillStyle = '#38bdf8'; ctx.font = `bold ${W*0.065}px sans-serif`;
    ctx.fillText('CLICK TO RESTART', W/2, H*0.73);
    return;
  }

  // P1 controls (W/S)
  if (keys['w'] || keys['W']) p1.y = Math.max(0, p1.y - 5);
  if (keys['s'] || keys['S']) p1.y = Math.min(H-PADDLE_H, p1.y + 5);
  // P2 controls (arrow keys) — if no arrow key, AI takes over
  if (keys['ArrowUp']) p2.y = Math.max(0, p2.y - 5);
  else if (keys['ArrowDown']) p2.y = Math.min(H-PADDLE_H, p2.y + 5);
  else aiUpdate();

  // Ball
  ball.x += ball.vx; ball.y += ball.vy;

  // Wall bounce
  if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); spawnParticles(ball.x, ball.y, '#fff'); }
  if (ball.y + BALL_R > H) { ball.y = H-BALL_R; ball.vy = -Math.abs(ball.vy); spawnParticles(ball.x, ball.y, '#fff'); }

  // Paddle collisions
  // Left paddle
  if (ball.x - BALL_R < p1.x + PADDLE_W && ball.x - BALL_R > p1.x &&
      ball.y > p1.y && ball.y < p1.y + PADDLE_H && ball.vx < 0) {
    ball.vx = Math.abs(ball.vx) * 1.05;
    const hitPos = (ball.y - (p1.y + PADDLE_H/2)) / (PADDLE_H/2);
    ball.vy = hitPos * 6;
    ball.speed = Math.min(15, ball.speed * 1.05);
    spawnParticles(ball.x, ball.y, '#8b5cf6');
  }
  // Right paddle
  if (ball.x + BALL_R > p2.x && ball.x + BALL_R < p2.x + PADDLE_W + 5 &&
      ball.y > p2.y && ball.y < p2.y + PADDLE_H && ball.vx > 0) {
    ball.vx = -Math.abs(ball.vx) * 1.05;
    const hitPos = (ball.y - (p2.y + PADDLE_H/2)) / (PADDLE_H/2);
    ball.vy = hitPos * 6;
    ball.speed = Math.min(15, ball.speed * 1.05);
    spawnParticles(ball.x, ball.y, '#38bdf8');
  }

  // Scoring
  if (ball.x < 0) { scoreR++; spawnParticles(W*0.1, H/2, '#ff4444'); resetBall(1); if (scoreR >= MAX_SCORE) state = STATE.OVER; }
  if (ball.x > W) { scoreL++; spawnParticles(W*0.9, H/2, '#4ade80'); resetBall(-1); if (scoreL >= MAX_SCORE) state = STATE.OVER; }

  // Particles
  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vx*=0.9; p.vy*=0.9; p.life--; });
  particles = particles.filter(p=>p.life>0);
  particles.forEach(p => { ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fillStyle=p.color; ctx.globalAlpha=p.life/20; ctx.fill(); ctx.globalAlpha=1; });

  // Draw paddles
  drawPaddle(p1, '#8b5cf6');
  drawPaddle(p2, '#38bdf8');

  // Draw ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 15;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Score
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.font = `bold ${W*0.1}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(scoreL, W*0.27, H*0.15);
  ctx.fillText(scoreR, W*0.73, H*0.15);
}

loop();
</script>
</body>
</html>
