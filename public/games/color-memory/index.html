<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simon Says</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0f0f1a; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:'Segoe UI',sans-serif; color:#e0e0e0; user-select:none; }
h1 { font-size:1.8rem; color:#7c3aed; margin-bottom:4px; font-weight:900; letter-spacing:3px; }
#status { font-size:1rem; color:#9ca3af; margin:8px 0; min-height:28px; text-align:center; }
#score-wrap { display:flex; gap:40px; font-size:0.85rem; color:#9ca3af; margin-bottom:16px; }
#score-wrap b { color:#c084fc; font-size:1.3rem; }
#game { position:relative; width:min(300px,80vw); height:min(300px,80vw); margin:8px 0; }
.btn {
  position:absolute; width:47%; height:47%;
  border:4px solid #1a1a2e; border-radius:50%;
  cursor:pointer; transition:filter 0.1s, transform 0.1s;
  opacity:0.4;
}
.btn.lit { opacity:1; filter:brightness(1.5); transform:scale(1.03); }
.btn.flash { opacity:1; filter:brightness(2.5); }
#btn-0 { top:0; left:0; background:#ef4444; border-radius:50% 0 0 0; border-radius:100% 0 0 0; }
#btn-1 { top:0; right:0; background:#22c55e; border-radius:0 100% 0 0; }
#btn-2 { bottom:0; left:0; background:#eab308; border-radius:0 0 0 100%; }
#btn-3 { bottom:0; right:0; background:#3b82f6; border-radius:0 0 100% 0; }
#center {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:26%; height:26%; background:#0f0f1a; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:1.4rem; font-weight:900; color:#7c3aed; border:3px solid #2e1065;
  z-index:10;
}
#start-btn { margin-top:16px; background:#7c3aed; color:#fff; border:none; padding:12px 36px; border-radius:8px; font-size:1rem; font-weight:700; cursor:pointer; }
#start-btn:hover { background:#6d28d9; }
#level-badge { background:#1e1b4b; border:1px solid #3b0764; padding:4px 14px; border-radius:20px; font-size:0.8rem; color:#9ca3af; margin-bottom:8px; }
</style>
</head>
<body>
<h1>🎵 SIMON SAYS</h1>
<div id="level-badge">Level <span id="level-num">0</span></div>
<div id="status">Press Start to play!</div>
<div id="score-wrap">Score: <b id="score">0</b> &nbsp; Best: <b id="best">0</b></div>
<div id="game">
  <div class="btn" id="btn-0"></div>
  <div class="btn" id="btn-1"></div>
  <div class="btn" id="btn-2"></div>
  <div class="btn" id="btn-3"></div>
  <div id="center">🎮</div>
</div>
<button id="start-btn" onclick="startGame()">▶ Start</button>

<script>
const FREQS=[220,276,330,440];
let seq=[], userSeq=[], score=0, best=parseInt(localStorage.getItem('simon_best')||'0'), playing=false, accepting=false;
let ac=null;

function playTone(i,dur=300) {
  try {
    if (!ac) ac=new(window.AudioContext||window.webkitAudioContext)();
    const osc=ac.createOscillator(), gain=ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type='sine'; osc.frequency.value=FREQS[i];
    gain.gain.setValueAtTime(0.4,ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur/1000);
    osc.start(); osc.stop(ac.currentTime+dur/1000);
  } catch(e){}
}

function flash(i,dur=350) {
  return new Promise(res=>{
    const btn=document.getElementById(`btn-${i}`);
    btn.classList.add('flash'); playTone(i,dur-50);
    setTimeout(()=>{ btn.classList.remove('flash'); setTimeout(res,80); },dur);
  });
}

async function playSequence() {
  accepting=false; setStatus('Watch carefully…');
  const speed=Math.max(200,400-seq.length*15);
  for (let i of seq) { await flash(i,speed); await delay(speed*0.4); }
  accepting=true; userSeq=[];
  setStatus(`Your turn! (${seq.length} steps)`);
}

function delay(ms) { return new Promise(r=>setTimeout(r,ms)); }

async function startGame() {
  document.getElementById('start-btn').style.display='none';
  seq=[]; score=0; playing=true;
  document.getElementById('score').textContent=0;
  document.getElementById('best').textContent=best;
  await delay(600); nextRound();
}

async function nextRound() {
  seq.push(Math.floor(Math.random()*4));
  document.getElementById('level-num').textContent=seq.length;
  await delay(500); playSequence();
}

function btnClick(i) {
  if (!accepting) return;
  flash(i,200);
  userSeq.push(i);
  const pos=userSeq.length-1;
  if (userSeq[pos]!==seq[pos]) { gameover(); return; }
  if (userSeq.length===seq.length) {
    score=seq.length; document.getElementById('score').textContent=score;
    if (score>best) { best=score; localStorage.setItem('simon_best',best); document.getElementById('best').textContent=best; }
    accepting=false; setStatus('✅ Correct!'); setTimeout(nextRound,800);
  }
}

function gameover() {
  accepting=false; playing=false;
  setStatus(`❌ Game Over! Score: ${score}`);
  [0,1,2,3].forEach(i=>{ setTimeout(()=>{ document.getElementById(`btn-${i}`).classList.add('lit'); setTimeout(()=>document.getElementById(`btn-${i}`).classList.remove('lit'),300); },i*200); });
  document.getElementById('start-btn').textContent='▶ Play Again';
  document.getElementById('start-btn').style.display='block';
}

function setStatus(m) { document.getElementById('status').textContent=m; }

[0,1,2,3].forEach(i=>{
  const btn=document.getElementById(`btn-${i}`);
  btn.onclick=()=>btnClick(i);
  btn.addEventListener('touchend',e=>{e.preventDefault();btnClick(i);},{passive:false});
  btn.addEventListener('mouseenter',()=>{ if (accepting) btn.classList.add('lit'); });
  btn.addEventListener('mouseleave',()=>btn.classList.remove('lit'));
});

document.getElementById('best').textContent=best;
</script>
</body>
</html>
