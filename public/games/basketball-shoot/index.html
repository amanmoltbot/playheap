<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basketball Shoot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a14; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = Math.min(window.innerWidth, 500);
const H = Math.min(window.innerHeight, 700);
canvas.width = W; canvas.height = H;

const STATE = { MENU: 0, PLAY: 1, OVER: 2 };
let state = STATE.MENU;
let score, balls, hoop, shooting, shotBall, drag, combo, comboTimer;
let particles = [];
const GRAVITY = 0.4;

function initGame() {
  score = 0; balls = 5; combo = 0; comboTimer = 0;
  hoop = { x: W/2 + (Math.random()-0.5)*W*0.3, y: H*0.3, w: 60, rim: 8 };
  shooting = false; drag = null; shotBall = null; particles = [];
  state = STATE.PLAY;
}

function spawnParticles(x, y, color, n) {
  for (let i=0; i<n; i++) {
    const a = Math.random()*Math.PI*2, s = 2+Math.random()*5;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 30, color });
  }
}

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const sc = canvas.width / r.width;
  if (e.touches) return { x:(e.touches[0].clientX-r.left)*sc, y:(e.touches[0].clientY-r.top)*sc };
  return { x:(e.clientX-r.left)*sc, y:(e.clientY-r.top)*sc };
}

const BALL_Y = H*0.82;
let ballX = W/2;

canvas.addEventListener('mousedown', e => {
  if (state === STATE.MENU || state === STATE.OVER) { initGame(); return; }
  if (shooting) return;
  const p = getPos(e);
  drag = { startX: p.x, startY: p.y, curX: p.x, curY: p.y };
});
canvas.addEventListener('mousemove', e => {
  if (!drag) return;
  const p = getPos(e);
  drag.curX = p.x; drag.curY = p.y;
});
canvas.addEventListener('mouseup', e => {
  if (!drag || state !== STATE.PLAY) { drag = null; return; }
  const dx = drag.startX - drag.curX;
  const dy = drag.startY - drag.curY;
  if (Math.sqrt(dx*dx+dy*dy) < 10) { drag = null; return; }
  const power = Math.min(Math.sqrt(dx*dx+dy*dy)*0.1, 18);
  const angle = Math.atan2(dy, dx);
  shotBall = { x: ballX, y: BALL_Y, vx: Math.cos(angle)*power, vy: Math.sin(angle)*power, r: 18, spin: 0 };
  shooting = true; drag = null; balls--;
});
canvas.addEventListener('touchstart', e => { e.preventDefault(); if (state !== STATE.PLAY) { initGame(); return; } if (shooting) return; const p = getPos(e); drag = { startX:p.x, startY:p.y, curX:p.x, curY:p.y }; });
canvas.addEventListener('touchmove', e => { e.preventDefault(); if (!drag) return; const p=getPos(e); drag.curX=p.x; drag.curY=p.y; });
canvas.addEventListener('touchend', e => {
  e.preventDefault(); if (!drag || state !== STATE.PLAY) { drag=null; return; }
  const dx=drag.startX-drag.curX, dy=drag.startY-drag.curY;
  if (Math.sqrt(dx*dx+dy*dy) < 10) { drag=null; return; }
  const power=Math.min(Math.sqrt(dx*dx+dy*dy)*0.1,18);
  const angle=Math.atan2(dy,dx);
  shotBall={x:ballX, y:BALL_Y, vx:Math.cos(angle)*power, vy:Math.sin(angle)*power, r:18, spin:0};
  shooting=true; drag=null; balls--;
});

let hoopMoveTimer = 0;

function drawHoop() {
  // Backboard
  ctx.fillStyle = '#fff5';
  ctx.fillRect(hoop.x + hoop.w/2 + 5, hoop.y - 40, 10, 55);
  // Rim
  ctx.strokeStyle = '#f97316';
  ctx.lineWidth = hoop.rim;
  ctx.shadowColor = '#f97316';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(hoop.x - hoop.w/2, hoop.y);
  ctx.lineTo(hoop.x + hoop.w/2, hoop.y);
  ctx.stroke();
  ctx.shadowBlur = 0;
  // Net
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1.5;
  for (let i=0; i<=4; i++) {
    const tx = (hoop.x - hoop.w/2) + (hoop.w/4)*i;
    ctx.beginPath();
    ctx.moveTo(tx, hoop.y+4);
    ctx.lineTo(tx + (i-2)*3, hoop.y+28);
    ctx.stroke();
  }
  for (let j=0; j<3; j++) {
    ctx.beginPath();
    const yy = hoop.y + 10 + j*6;
    ctx.moveTo(hoop.x-hoop.w/2+j*2, yy);
    ctx.lineTo(hoop.x+hoop.w/2-j*2, yy);
    ctx.stroke();
  }
}

function drawBall(x, y, r, spin) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(spin);
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI*2);
  const grad = ctx.createRadialGradient(-r*0.3, -r*0.3, r*0.1, 0, 0, r);
  grad.addColorStop(0, '#f97316');
  grad.addColorStop(1, '#c2410c');
  ctx.fillStyle = grad;
  ctx.fill();
  // Lines
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 0, r*0.6, r, 0, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

function loop() {
  requestAnimationFrame(loop);
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, 0, W, H);

  // Background court lines
  ctx.strokeStyle = 'rgba(139,92,246,0.1)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(W/2, H*0.85, W*0.4, Math.PI, 0); ctx.stroke();

  if (state === STATE.MENU) {
    drawHoop();
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#f97316'; ctx.font = `bold ${W*0.12}px sans-serif`;
    ctx.textAlign = 'center'; ctx.fillText('BASKETBALL', W/2, H*0.3);
    ctx.fillText('SHOOT', W/2, H*0.42);
    ctx.fillStyle = '#aaa'; ctx.font = `${W*0.05}px sans-serif`;
    ctx.fillText('Click & drag to aim', W/2, H*0.57);
    ctx.fillText('Release to shoot!', W/2, H*0.63);
    ctx.fillStyle = '#f97316'; ctx.font = `bold ${W*0.065}px sans-serif`;
    ctx.fillText('CLICK TO START', W/2, H*0.78);
    return;
  }

  if (state === STATE.OVER) {
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#f97316'; ctx.font = `bold ${W*0.1}px sans-serif`;
    ctx.textAlign = 'center'; ctx.fillText('GAME OVER', W/2, H*0.35);
    ctx.fillStyle = '#fff'; ctx.font = `bold ${W*0.08}px sans-serif`;
    ctx.fillText(`Score: ${score}`, W/2, H*0.5);
    ctx.fillStyle = '#f97316'; ctx.font = `bold ${W*0.065}px sans-serif`;
    ctx.fillText('CLICK TO RESTART', W/2, H*0.67);
    particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vx*=0.9; p.vy*=0.9; p.life--; });
    particles = particles.filter(p=>p.life>0);
    particles.forEach(p => { ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fillStyle=p.color; ctx.globalAlpha=p.life/30; ctx.fill(); ctx.globalAlpha=1; });
    return;
  }

  // Move hoop
  hoopMoveTimer++;
  const moveAmt = Math.sin(hoopMoveTimer * 0.015) * W * 0.25;
  hoop.x = W/2 + moveAmt;
  hoop.x = Math.max(hoop.w/2+20, Math.min(W-hoop.w/2-20, hoop.x));

  // Draw hoop (behind ball)
  drawHoop();

  // Draw static ball at base
  if (!shooting) drawBall(ballX, BALL_Y, 18, 0);

  // Update shot ball
  if (shooting && shotBall) {
    shotBall.vx *= 0.995;
    shotBall.vy += GRAVITY;
    shotBall.x += shotBall.vx;
    shotBall.y += shotBall.vy;
    shotBall.spin += shotBall.vx * 0.05;

    // Check scored
    const dx = shotBall.x - hoop.x;
    const dy = shotBall.y - hoop.y;
    if (Math.abs(dx) < hoop.w/2 - shotBall.r/2 && Math.abs(dy) < 20 && shotBall.vy > 0) {
      combo++;
      const pts = combo >= 3 ? 3 : combo >= 2 ? 2 : 1;
      score += pts;
      spawnParticles(hoop.x, hoop.y, '#f97316', 15);
      spawnParticles(hoop.x, hoop.y, '#fbbf24', 10);
      shooting = false; shotBall = null;
    }
    // Miss (out of bounds)
    if (shotBall && (shotBall.y > H + 50 || shotBall.x < -50 || shotBall.x > W+50)) {
      combo = 0; shooting = false; shotBall = null;
    }

    if (shotBall) drawBall(shotBall.x, shotBall.y, shotBall.r, shotBall.spin);
  }

  // After shot, check game over
  if (!shooting && balls <= 0) state = STATE.OVER;

  // Drag indicator
  if (drag) {
    const dx = drag.startX - drag.curX;
    const dy = drag.startY - drag.curY;
    const angle = Math.atan2(dy, dx);
    const power = Math.min(Math.sqrt(dx*dx+dy*dy), 150);
    ctx.strokeStyle = 'rgba(139,92,246,0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6,6]);
    ctx.beginPath();
    ctx.moveTo(ballX, BALL_Y);
    ctx.lineTo(ballX + Math.cos(angle)*power*0.8, BALL_Y + Math.sin(angle)*power*0.8);
    ctx.stroke();
    ctx.setLineDash([]);
    // Arrowhead
    ctx.fillStyle = '#8b5cf6';
    const ex = ballX + Math.cos(angle)*power*0.8, ey = BALL_Y + Math.sin(angle)*power*0.8;
    ctx.beginPath();
    ctx.arc(ex, ey, 6, 0, Math.PI*2);
    ctx.fill();
    drawBall(ballX, BALL_Y, 18, 0);
  }

  // Particles
  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vx*=0.9; p.vy*=0.9; p.life--; });
  particles = particles.filter(p=>p.life>0);
  particles.forEach(p => { ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fillStyle=p.color; ctx.globalAlpha=p.life/30; ctx.fill(); ctx.globalAlpha=1; });

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${W*0.055}px sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillText(`Score: ${score}`, 14, 32);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#f97316';
  // Ball icons
  let ballStr = '';
  for (let i=0; i<balls; i++) ballStr += '🏀';
  ctx.fillText(ballStr, W-14, 32);
  if (combo >= 2) {
    ctx.fillStyle = '#fbbf24'; ctx.font = `bold ${W*0.065}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(`🔥 ${combo}x COMBO!`, W/2, H*0.78);
  }
}

loop();
</script>
<script>
/* ArcadeHeap Ad Placement API bridge */
(function(){
  if(window.parent===window)return;
  function requestAd(t){
    window.parent.postMessage({type:"adBreak",breakType:t||"next"},"*");
  }
  window.ahRequestAd=requestAd;
  var origAlert=window.alert;
  window.alert=function(msg){
    if(/game over|you win|you lose|congratulations|well done/i.test(msg)){
      requestAd("next");
    }
    return origAlert.apply(this,arguments);
  };
})();
</script>
</body>
</html>
