<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sliding Puzzle</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0f0f1a; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:'Segoe UI',sans-serif; color:#e0e0e0; padding:16px; }
h1 { font-size:1.8rem; color:#7c3aed; margin-bottom:6px; font-weight:900; letter-spacing:2px; }
#info { display:flex; gap:30px; font-size:0.85rem; color:#9ca3af; margin-bottom:12px; }
#info span { color:#c084fc; font-weight:700; }
#size-wrap { display:flex; gap:8px; margin-bottom:12px; }
.sz-btn { background:#1e1b4b; color:#9ca3af; border:1px solid #3b0764; padding:7px 16px; border-radius:6px; font-size:0.82rem; cursor:pointer; transition:all 0.15s; }
.sz-btn.active { background:#7c3aed; color:#fff; border-color:#7c3aed; }
#grid-wrap {
  width:min(380px,90vw); height:min(380px,90vw);
  position:relative; margin-bottom:16px;
  background:#1a1a2e; border:2px solid #3b0764; border-radius:10px; overflow:hidden;
}
.tile {
  position:absolute; display:flex; align-items:center; justify-content:center;
  font-size:clamp(18px,5vw,36px); font-weight:900; border-radius:6px;
  cursor:pointer; transition:top 0.15s, left 0.15s;
  background:linear-gradient(135deg,#1e1b4b,#2e1065);
  border:2px solid #7c3aed; color:#c084fc;
  box-shadow:0 3px 10px rgba(124,58,237,0.3);
  user-select:none;
}
.tile:hover { filter:brightness(1.2); }
.tile.empty { display:none; }
.tile.win { background:linear-gradient(135deg,#166534,#15803d); border-color:#34d399; color:#d1fae5; }
#msg { font-size:1rem; font-weight:700; color:#c084fc; min-height:28px; text-align:center; margin-bottom:8px; }
#new-btn { background:#7c3aed; color:#fff; border:none; padding:10px 28px; border-radius:6px; font-size:0.95rem; cursor:pointer; }
#new-btn:hover { background:#6d28d9; }
</style>
</head>
<body>
<h1>SLIDING PUZZLE</h1>
<div id="size-wrap">
  <button class="sz-btn active" onclick="setSize(3)">3×3</button>
  <button class="sz-btn" onclick="setSize(4)">4×4</button>
  <button class="sz-btn" onclick="setSize(5)">5×5</button>
</div>
<div id="info">Moves: <span id="moves">0</span> &nbsp; ⏱ <span id="timer">0:00</span></div>
<div id="msg"></div>
<div id="grid-wrap" id="grid-wrap"></div>
<button id="new-btn" onclick="newGame()">🔄 Shuffle</button>

<script>
let size=3, tiles=[], moves=0, won=false, timerSec=0, timerInt=null, touchStart=null;

function setSize(s) { size=s; document.querySelectorAll('.sz-btn').forEach(b=>b.classList.toggle('active',b.textContent===`${s}×${s}`)); newGame(); }

function newGame() {
  clearInterval(timerInt); timerSec=0; moves=0; won=false;
  updateTimer(); document.getElementById('moves').textContent=0;
  document.getElementById('msg').textContent='';
  tiles = [...Array(size*size).keys()];
  // Shuffle until solvable
  do { shuffle(tiles); } while (!isSolvable());
  timerInt = setInterval(()=>{ timerSec++; updateTimer(); },1000);
  render();
}

function shuffle(a) { for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; } }

function isSolvable() {
  const blank = tiles.indexOf(0);
  const row = Math.floor(blank/size);
  let inv=0;
  for (let i=0;i<tiles.length-1;i++) for (let j=i+1;j<tiles.length;j++) if (tiles[i]&&tiles[j]&&tiles[i]>tiles[j]) inv++;
  if (size%2===1) return inv%2===0;
  const rowFromBottom = size - row;
  return (inv+rowFromBottom)%2===1;
}

function updateTimer() {
  const m=Math.floor(timerSec/60), s=timerSec%60;
  document.getElementById('timer').textContent=`${m}:${s.toString().padStart(2,'0')}`;
}

function render() {
  const wrap = document.getElementById('grid-wrap');
  wrap.innerHTML='';
  const W = wrap.offsetWidth || 380;
  const cell = (W-8) / size;
  const gap = 4;
  for (let i=0;i<tiles.length;i++) {
    const v=tiles[i];
    const r=Math.floor(i/size), c=i%size;
    const div=document.createElement('div');
    div.className='tile'+(v===0?' empty':'')+(won?' win':'');
    div.style.width=(cell-gap)+'px'; div.style.height=(cell-gap)+'px';
    div.style.left=(4+c*(cell))+'px'; div.style.top=(4+r*(cell))+'px';
    div.textContent=v||'';
    div.dataset.idx=i;
    div.onclick=()=>clickTile(i);
    wrap.appendChild(div);
  }
}

function clickTile(idx) {
  if (won) return;
  const blank=tiles.indexOf(0);
  const r1=Math.floor(idx/size),c1=idx%size;
  const r2=Math.floor(blank/size),c2=blank%size;
  if (Math.abs(r1-r2)+Math.abs(c1-c2)!==1) return;
  [tiles[idx],tiles[blank]]=[tiles[blank],tiles[idx]];
  moves++; document.getElementById('moves').textContent=moves;
  render();
  if (isWon()) { won=true; clearInterval(timerInt); document.getElementById('msg').textContent=`🎉 Solved in ${moves} moves!`; render(); }
}

function isWon() { return tiles.every((v,i)=>v===(i+1)%tiles.length); }

// Swipe support
const wrap2 = document.getElementById('grid-wrap');
wrap2.addEventListener('touchstart',e=>{ touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; },{passive:true});
wrap2.addEventListener('touchend',e=>{
  if (!touchStart) return;
  const dx=e.changedTouches[0].clientX-touchStart.x, dy=e.changedTouches[0].clientY-touchStart.y;
  const blank=tiles.indexOf(0);
  let target=-1;
  if (Math.abs(dx)>Math.abs(dy)) { if (dx>20) target=blank-1; else if (dx<-20) target=blank+1; }
  else { if (dy>20) target=blank-size; else if (dy<-20) target=blank+size; }
  if (target>=0&&target<tiles.length) clickTile(target);
  touchStart=null;
},{passive:true});

// Keyboard
document.addEventListener('keydown',e=>{
  const blank=tiles.indexOf(0);
  let target=-1;
  if (e.key==='ArrowLeft')  target=blank+1;
  if (e.key==='ArrowRight') target=blank-1;
  if (e.key==='ArrowUp')    target=blank+size;
  if (e.key==='ArrowDown')  target=blank-size;
  if (target>=0&&target<tiles.length) clickTile(target);
});

newGame();
</script>
</body>
</html>
