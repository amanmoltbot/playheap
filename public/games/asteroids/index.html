<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroids</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0f0f1a; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:'Segoe UI',sans-serif; color:#e0e0e0; overflow:hidden; }
canvas { border:2px solid #3b0764; border-radius:8px; background:#06060f; box-shadow:0 0 30px rgba(124,58,237,0.3); touch-action:none; }
#ui { display:flex; justify-content:space-between; align-items:center; width:min(500px,95vw); padding:8px 4px; }
#ui span { font-size:0.85rem; color:#9ca3af; }
#ui b { color:#c084fc; font-size:1rem; }
#touch-ctrl { display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; justify-content:center; }
.tch-btn {
  background:#1e1b4b; border:1px solid #3b0764; color:#c084fc;
  padding:10px 18px; border-radius:8px; font-size:1.1rem; cursor:pointer;
  user-select:none; -webkit-user-select:none;
}
.tch-btn:active { background:#7c3aed; }
#overlay {
  position:fixed; inset:0; background:rgba(6,6,15,0.92); display:flex; flex-direction:column;
  align-items:center; justify-content:center; z-index:10;
}
#overlay h2 { font-size:2rem; color:#c084fc; margin-bottom:8px; }
#overlay p { color:#9ca3af; margin-bottom:6px; font-size:0.9rem; text-align:center; max-width:300px; }
#overlay button { margin-top:16px; background:#7c3aed; color:#fff; border:none; padding:12px 36px; border-radius:8px; font-size:1rem; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<div id="ui">
  <span>Score: <b id="score">0</b></span>
  <span>Lives: <b id="lives">3</b></span>
  <span>Level: <b id="level">1</b></span>
</div>
<canvas id="c" width="500" height="500"></canvas>
<div id="touch-ctrl">
  <button class="tch-btn" id="t-left">◀</button>
  <button class="tch-btn" id="t-thrust">🚀</button>
  <button class="tch-btn" id="t-right">▶</button>
  <button class="tch-btn" id="t-shoot">🔫</button>
</div>
<div id="overlay">
  <h2>☄️ Asteroids</h2>
  <p>Destroy all asteroids! Shoot them to split them apart.<br>Watch out — smaller rocks are faster!</p>
  <p style="font-size:0.8rem;margin-top:4px">Arrow keys / WASD + Space to shoot</p>
  <button onclick="startGame()">▶ Launch!</button>
</div>

<script>
const C=document.getElementById('c'), ctx=C.getContext('2d');
const W=C.width,H=C.height;
let ship,bullets,asteroids,particles,score,lives,level,raf,gameActive=false;
const keys={};

// Resize for mobile
function resizeCanvas() {
  const s=Math.min(window.innerWidth*0.95,window.innerHeight*0.6,500);
  C.style.width=s+'px'; C.style.height=s+'px';
}
resizeCanvas(); window.onresize=resizeCanvas;

function rand(a,b){return a+Math.random()*(b-a);}
function randSign(){return Math.random()<0.5?1:-1;}

class Ship {
  constructor(){this.x=W/2;this.y=H/2;this.a=0;this.vx=0;this.vy=0;this.r=14;this.thrust=false;this.inv=180;this.dead=false;}
  update(){
    if(this.dead)return;
    if(keys['ArrowLeft']||keys['a']||touchKeys.left) this.a-=0.05;
    if(keys['ArrowRight']||keys['d']||touchKeys.right) this.a+=0.05;
    if(keys['ArrowUp']||keys['w']||touchKeys.thrust){
      this.vx+=Math.cos(this.a)*0.25; this.vy+=Math.sin(this.a)*0.25; this.thrust=true;
    } else this.thrust=false;
    this.vx*=0.99; this.vy*=0.99;
    this.x=(this.x+this.vx+W)%W; this.y=(this.y+this.vy+H)%H;
    if(this.inv>0) this.inv--;
  }
  draw(){
    if(this.dead) return;
    if(this.inv>0&&Math.floor(this.inv/6)%2===0) return;
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.a);
    ctx.strokeStyle='#c084fc'; ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(18,0); ctx.lineTo(-12,-10); ctx.lineTo(-8,0); ctx.lineTo(-12,10); ctx.closePath(); ctx.stroke();
    if(this.thrust){
      ctx.strokeStyle='#fb923c'; ctx.beginPath();
      ctx.moveTo(-8,0); ctx.lineTo(-18+rand(-4,0),rand(-4,4)); ctx.stroke();
    }
    ctx.restore();
  }
}

class Bullet {
  constructor(x,y,a){this.x=x;this.y=y;this.vx=Math.cos(a)*8;this.vy=Math.sin(a)*8;this.life=60;this.r=3;}
  update(){this.x=(this.x+this.vx+W)%W;this.y=(this.y+this.vy+H)%H;this.life--;}
  draw(){ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(this.x,this.y,2,0,Math.PI*2);ctx.fill();}
}

class Asteroid {
  constructor(x,y,size){
    this.x=x;this.y=y; this.size=size; // 3=large,2=med,1=small
    const s=[0,30,55,90][size];
    this.r=s+rand(-5,5);
    const sp=(4-size)*0.6+rand(0.2,0.8);
    const ang=rand(0,Math.PI*2);
    this.vx=Math.cos(ang)*sp*randSign(); this.vy=Math.sin(ang)*sp*randSign();
    this.rot=rand(-0.03,0.03); this.a=0;
    this.pts=[]; for(let i=0;i<10;i++) this.pts.push(this.r*rand(0.7,1.1));
  }
  update(){this.x=(this.x+this.vx+W)%W;this.y=(this.y+this.vy+H)%H;this.a+=this.rot;}
  draw(){
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.a);
    ctx.strokeStyle='#8b5cf6';ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<this.pts.length;i++){
      const ang=(i/this.pts.length)*Math.PI*2;
      const p=this.pts[i];
      i===0?ctx.moveTo(Math.cos(ang)*p,Math.sin(ang)*p):ctx.lineTo(Math.cos(ang)*p,Math.sin(ang)*p);
    }
    ctx.closePath();ctx.stroke();ctx.restore();
  }
}

function spawnParticles(x,y,n,col){
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2),sp=rand(1,4);
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:40,col:col||'#c084fc'});
  }
}

function spawnAsteroids(){
  for(let i=0;i<3+level;i++){
    let x,y;
    do{x=rand(0,W);y=rand(0,H);}while(Math.hypot(x-W/2,y-H/2)<150);
    asteroids.push(new Asteroid(x,y,3));
  }
}

const touchKeys={left:false,right:false,thrust:false,shoot:false};
let lastShot=0;

function setupTouch(){
  const map={['t-left']:'left',['t-right']:'right',['t-thrust']:'thrust',['t-shoot']:'shoot'};
  Object.entries(map).forEach(([id,k])=>{
    const el=document.getElementById(id);
    el.addEventListener('touchstart',e=>{e.preventDefault();touchKeys[k]=true;},{passive:false});
    el.addEventListener('touchend',e=>{e.preventDefault();touchKeys[k]=false;},{passive:false});
    el.addEventListener('mousedown',()=>touchKeys[k]=true);
    el.addEventListener('mouseup',()=>touchKeys[k]=false);
  });
}

function startGame(){
  document.getElementById('overlay').style.display='none';
  score=0;lives=3;level=1;gameActive=true;
  ship=new Ship(); bullets=[]; asteroids=[]; particles=[];
  spawnAsteroids();
  document.getElementById('score').textContent=0;
  document.getElementById('lives').textContent=3;
  document.getElementById('level').textContent=1;
  if(raf)cancelAnimationFrame(raf);
  loop();
}

function loop(){
  raf=requestAnimationFrame(loop);
  ctx.fillStyle='rgba(6,6,15,0.25)';ctx.fillRect(0,0,W,H);
  
  // Update ship
  ship.update();
  
  // Shoot
  const now=performance.now();
  if((keys[' ']||keys['x']||touchKeys.shoot)&&now-lastShot>250&&!ship.dead){
    bullets.push(new Bullet(ship.x+Math.cos(ship.a)*18,ship.y+Math.sin(ship.a)*18,ship.a));
    lastShot=now;
  }
  
  // Update bullets
  bullets=bullets.filter(b=>{b.update();b.draw();return b.life>0;});
  
  // Update asteroids
  asteroids.forEach(a=>{a.update();a.draw();});
  
  // Update particles
  particles=particles.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.life--;
    ctx.globalAlpha=p.life/40;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    return p.life>0;
  });
  
  // Bullet-asteroid collision
  for(let bi=bullets.length-1;bi>=0;bi--){
    for(let ai=asteroids.length-1;ai>=0;ai--){
      const b=bullets[bi],a=asteroids[ai];
      if(Math.hypot(b.x-a.x,b.y-a.y)<a.r){
        spawnParticles(a.x,a.y,8);
        bullets.splice(bi,1);
        score+=[0,50,100,200][a.size];
        document.getElementById('score').textContent=score;
        if(a.size>1){
          asteroids.push(new Asteroid(a.x,a.y,a.size-1));
          asteroids.push(new Asteroid(a.x,a.y,a.size-1));
        }
        asteroids.splice(ai,1);
        break;
      }
    }
  }
  
  // Ship-asteroid collision
  if(!ship.dead&&ship.inv===0){
    for(const a of asteroids){
      if(Math.hypot(ship.x-a.x,ship.y-a.y)<a.r+ship.r-8){
        spawnParticles(ship.x,ship.y,20,'#fb923c');
        lives--;
        document.getElementById('lives').textContent=lives;
        if(lives<=0){
          ship.dead=true; gameOver(); return;
        }
        ship=new Ship();
        break;
      }
    }
  }
  
  ship.draw();
  
  // Level clear
  if(asteroids.length===0){
    level++;document.getElementById('level').textContent=level;
    spawnAsteroids();
  }
}

function gameOver(){
  setTimeout(()=>{
    const ov=document.getElementById('overlay');
    ov.innerHTML=`<h2>💀 Game Over</h2><p>Score: <b style="color:#c084fc;font-size:1.2rem">${score}</b></p><p>Level reached: ${level}</p><button onclick="startGame()">▶ Try Again</button>`;
    ov.style.display='flex';
  },1500);
}

document.addEventListener('keydown',e=>{keys[e.key]=true;});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
setupTouch();
</script>
</body>
</html>
