<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Hockey</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0f0f1a; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:'Segoe UI',sans-serif; color:#e0e0e0; }
canvas { border:2px solid #3b0764; border-radius:8px; background:#08080f; box-shadow:0 0 30px rgba(124,58,237,0.3); touch-action:none; cursor:none; display:block; }
#hud { display:flex; gap:50px; font-size:0.9rem; color:#9ca3af; margin-bottom:10px; }
#hud .sc { font-size:1.4rem; font-weight:900; color:#c084fc; }
#hud .name { font-size:0.75rem; color:#6b7280; }
#msg { font-size:1rem; font-weight:700; color:#fbbf24; min-height:24px; text-align:center; margin-top:8px; }
#diff-wrap { display:flex; gap:8px; margin-bottom:10px; }
.diff-btn { background:#1e1b4b; color:#9ca3af; border:1px solid #3b0764; padding:7px 16px; border-radius:6px; font-size:0.82rem; cursor:pointer; }
.diff-btn.active { background:#7c3aed; color:#fff; border-color:#7c3aed; }
#overlay { position:fixed; inset:0; background:rgba(6,6,15,0.9); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10; }
#overlay h2 { font-size:2rem; color:#c084fc; margin-bottom:8px; }
#overlay button { margin-top:16px; background:#7c3aed; color:#fff; border:none; padding:12px 36px; border-radius:8px; font-size:1rem; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<div id="hud">
  <div style="text-align:center"><div class="name">AI</div><div class="sc" id="sc-ai">0</div></div>
  <div style="text-align:center"><div class="name">YOU</div><div class="sc" id="sc-p">0</div></div>
</div>
<div id="diff-wrap">
  <button class="diff-btn" onclick="setDiff('easy')">Easy</button>
  <button class="diff-btn active" onclick="setDiff('normal')">Normal</button>
  <button class="diff-btn" onclick="setDiff('hard')">Hard</button>
</div>
<canvas id="c"></canvas>
<div id="msg">Move your mouse or touch to control the paddle</div>
<div id="overlay">
  <h2>🏒 Air Hockey</h2>
  <p style="color:#9ca3af;margin-bottom:4px">First to 7 wins!</p>
  <p style="color:#6b7280;font-size:0.85rem">Move mouse / touch to control bottom paddle</p>
  <button onclick="startGame()">▶ Play!</button>
</div>

<script>
const C=document.getElementById('c');
const ctx=C.getContext('2d');
let W=380,H=560;
C.width=W; C.height=H;

const DIFFS={easy:{speed:3,reflex:0.04},normal:{speed:4.5,reflex:0.07},hard:{speed:6,reflex:0.12}};
let diff='normal';
let puck,playerP,aiP,scP,scAI,raf,gameActive=false,touchX=null;

function setDiff(d){ diff=d; document.querySelectorAll('.diff-btn').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()===d)); }

function reset(){
  const s=DIFFS[diff];
  const ang=(Math.random()*0.8+0.1)*Math.PI*(Math.random()<0.5?1:-1)+(Math.random()<0.5?0:Math.PI);
  puck={x:W/2,y:H/2,r:14,vx:Math.cos(ang)*s.speed*1.3,vy:Math.sin(ang)*s.speed*1.3,speed:s.speed};
  playerP={x:W/2,y:H-60,r:28,tx:W/2,ty:H-60};
  aiP={x:W/2,y:60,r:28};
}

function startGame(){
  document.getElementById('overlay').style.display='none';
  scP=0;scAI=0; updateScore(); gameActive=true;
  reset();
  if(raf)cancelAnimationFrame(raf);
  loop();
}

function updateScore(){
  document.getElementById('sc-p').textContent=scP;
  document.getElementById('sc-ai').textContent=scAI;
}

function setMsg(m){document.getElementById('msg').textContent=m;}

function loop(){
  raf=requestAnimationFrame(loop);
  ctx.fillStyle='#08080f'; ctx.fillRect(0,0,W,H);
  
  // Field lines
  ctx.strokeStyle='#1e1b4b'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H/2,70,0,Math.PI*2); ctx.stroke();
  
  // Goals
  const gw=120;
  ctx.strokeStyle='#7c3aed'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(W/2-gw/2,2); ctx.lineTo(W/2+gw/2,2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W/2-gw/2,H-2); ctx.lineTo(W/2+gw/2,H-2); ctx.stroke();
  
  // Move player
  if(touchX!==null) playerP.tx=touchX;
  playerP.x+=(playerP.tx-playerP.x)*0.3;
  playerP.x=Math.max(playerP.r,Math.min(W-playerP.r,playerP.x));
  
  // AI
  const s=DIFFS[diff];
  if(puck.vy<0) {
    const dx=puck.x-aiP.x;
    aiP.x+=Math.sign(dx)*Math.min(Math.abs(dx)*s.reflex*3,s.speed*1.5);
  } else {
    aiP.x+=(W/2-aiP.x)*s.reflex;
  }
  aiP.x=Math.max(aiP.r,Math.min(W-aiP.r,aiP.x));
  
  // Move puck
  puck.x+=puck.vx; puck.y+=puck.vy;
  
  // Wall bounce
  if(puck.x-puck.r<0){puck.x=puck.r;puck.vx=Math.abs(puck.vx);}
  if(puck.x+puck.r>W){puck.x=W-puck.r;puck.vx=-Math.abs(puck.vx);}
  
  // Goal scoring
  const gLeft=W/2-gw/2,gRight=W/2+gw/2;
  if(puck.y-puck.r<0) {
    if(puck.x>gLeft&&puck.x<gRight){ scP++; updateScore(); setMsg('⚽ You scored!'); if(scP>=7)endGame('YOU WIN! 🎉'); else reset(); }
    else { puck.vy=Math.abs(puck.vy); }
  }
  if(puck.y+puck.r>H) {
    if(puck.x>gLeft&&puck.x<gRight){ scAI++; updateScore(); setMsg('AI scored 😤'); if(scAI>=7)endGame('AI Wins 🤖'); else reset(); }
    else { puck.vy=-Math.abs(puck.vy); }
  }
  
  // Paddle collision
  const paddles=[playerP,aiP];
  paddles.forEach(p=>{
    const dx=puck.x-p.x, dy=puck.y-p.y;
    const dist=Math.hypot(dx,dy);
    if(dist<puck.r+p.r){
      const nx=dx/dist, ny=dy/dist;
      const dot=puck.vx*nx+puck.vy*ny;
      puck.vx-=2*dot*nx; puck.vy-=2*dot*ny;
      // Boost slightly
      const spd=Math.hypot(puck.vx,puck.vy);
      const boost=Math.min(spd*1.05,puck.speed*2);
      puck.vx*=boost/spd; puck.vy*=boost/spd;
      // Reposition
      puck.x=p.x+nx*(puck.r+p.r+1); puck.y=p.y+ny*(puck.r+p.r+1);
    }
  });
  
  // Draw
  // Puck
  ctx.fillStyle='#f0f0ff';
  ctx.shadowColor='#c084fc'; ctx.shadowBlur=15;
  ctx.beginPath(); ctx.arc(puck.x,puck.y,puck.r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  
  // Player paddle
  ctx.fillStyle='#7c3aed';
  ctx.shadowColor='#8b5cf6'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(playerP.x,playerP.y,playerP.r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.arc(playerP.x-6,playerP.y-6,8,0,Math.PI*2); ctx.fill();
  
  // AI paddle
  ctx.fillStyle='#f43f5e';
  ctx.shadowColor='#f43f5e'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(aiP.x,aiP.y,aiP.r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
}

function endGame(msg){
  gameActive=false; cancelAnimationFrame(raf);
  const ov=document.getElementById('overlay');
  ov.innerHTML=`<h2 style="color:${msg.includes('YOU')? '#34d399':'#f43f5e'}">${msg}</h2><p style="color:#9ca3af">Final: You ${scP} – ${scAI} AI</p><button onclick="startGame()">▶ Play Again</button>`;
  ov.style.display='flex';
}

C.addEventListener('mousemove',e=>{
  const rect=C.getBoundingClientRect();
  const scaleX=W/rect.width;
  playerP.tx=(e.clientX-rect.left)*scaleX;
});

C.addEventListener('touchmove',e=>{
  e.preventDefault();
  const rect=C.getBoundingClientRect();
  const scaleX=W/rect.width;
  touchX=(e.touches[0].clientX-rect.left)*scaleX;
},{passive:false});

C.addEventListener('touchend',()=>touchX=null,{passive:true});
</script>
<script>
/* ArcadeHeap Ad Placement API bridge */
(function(){
  if(window.parent===window)return;
  function requestAd(t){
    window.parent.postMessage({type:"adBreak",breakType:t||"next"},"*");
  }
  window.ahRequestAd=requestAd;
  var origAlert=window.alert;
  window.alert=function(msg){
    if(/game over|you win|you lose|congratulations|well done/i.test(msg)){
      requestAd("next");
    }
    return origAlert.apply(this,arguments);
  };
})();
</script>
</body>
</html>
