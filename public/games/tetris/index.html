<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: #e0e0e0;
    user-select: none;
  }
  h1 { font-size: 2rem; color: #7c3aed; margin-bottom: 10px; letter-spacing: 2px; }
  #game-wrap { display: flex; gap: 20px; align-items: flex-start; }
  canvas {
    border: 2px solid #3b0764;
    border-radius: 4px;
    background: #0a0a14;
    box-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
  }
  #side {
    width: 120px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .panel {
    background: #13131f;
    border: 1px solid #2e1065;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .panel .label { font-size: 0.7rem; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .panel .value { font-size: 1.4rem; color: #c084fc; font-weight: bold; }
  #next-canvas { margin: 6px auto 0; display: block; }
  #ctrl { margin-top: 12px; color: #555; font-size: 0.78rem; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<h1>🧩 TETRIS</h1>
<div id="game-wrap">
  <canvas id="c" width="200" height="400"></canvas>
  <div id="side">
    <div class="panel"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="panel"><div class="label">Level</div><div class="value" id="level">1</div></div>
    <div class="panel"><div class="label">Lines</div><div class="value" id="lines">0</div></div>
    <div class="panel">
      <div class="label">Next</div>
      <canvas id="next-canvas" width="80" height="80"></canvas>
    </div>
  </div>
</div>
<div id="ctrl">← → to move · ↑ to rotate<br>↓ to soft drop · Space for hard drop<br>P to pause</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('next-canvas');
const nctx = nextCanvas.getContext('2d');
const BLOCK = 20, COLS = 10, ROWS = 20;

const PIECES = [
  { shape: [[1,1,1,1]], color: '#06b6d4' },          // I
  { shape: [[1,1],[1,1]], color: '#eab308' },         // O
  { shape: [[0,1,0],[1,1,1]], color: '#8b5cf6' },     // T
  { shape: [[1,0,0],[1,1,1]], color: '#3b82f6' },     // J
  { shape: [[0,0,1],[1,1,1]], color: '#f97316' },     // L
  { shape: [[0,1,1],[1,1,0]], color: '#22c55e' },     // S
  { shape: [[1,1,0],[0,1,1]], color: '#f43f5e' },     // Z
];

let board, current, next, score, level, lines, state, dropInterval, lastDrop, raf;
let keys = {}, keyTimers = {};

function newGame() {
  board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  score = 0; level = 1; lines = 0;
  current = newPiece();
  next = newPiece();
  state = 'playing';
  lastDrop = Date.now();
  updateHUD();
  if (!raf) loop();
}

function newPiece() {
  const p = PIECES[Math.floor(Math.random() * PIECES.length)];
  return {
    shape: p.shape.map(r => [...r]),
    color: p.color,
    x: Math.floor(COLS/2) - Math.floor(p.shape[0].length/2),
    y: 0
  };
}

function rotate(shape) {
  const R = shape.length, C = shape[0].length;
  return Array.from({length: C}, (_,c) => Array.from({length: R}, (_,r) => shape[R-1-r][c]));
}

function valid(shape, x, y) {
  for (let r = 0; r < shape.length; r++)
    for (let c = 0; c < shape[r].length; c++)
      if (shape[r][c]) {
        const nx = x+c, ny = y+r;
        if (nx<0||nx>=COLS||ny>=ROWS) return false;
        if (ny>=0 && board[ny][nx]) return false;
      }
  return true;
}

function place() {
  current.shape.forEach((row, r) =>
    row.forEach((v, c) => { if (v) board[current.y+r][current.x+c] = current.color; })
  );
  // Clear lines
  let cleared = 0;
  for (let r = ROWS-1; r >= 0; r--) {
    if (board[r].every(c => c)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(0));
      r++;
      cleared++;
    }
  }
  if (cleared) {
    const pts = [0, 100, 300, 500, 800][cleared] * level;
    score += pts;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    updateHUD();
  }
  current = next;
  next = newPiece();
  if (!valid(current.shape, current.x, current.y)) {
    state = 'gameover';
  }
}

function hardDrop() {
  while (valid(current.shape, current.x, current.y+1)) current.y++;
  score += 2;
  place();
  updateHUD();
}

function tick() {
  if (state !== 'playing') return;
  const interval = Math.max(50, 800 - (level-1)*70);
  // Key handling
  if (keys['ArrowLeft'] && !keyTimers['ArrowLeft']) {
    if (valid(current.shape, current.x-1, current.y)) current.x--;
    keyTimers['ArrowLeft'] = setTimeout(() => { delete keyTimers['ArrowLeft']; }, 150);
  }
  if (keys['ArrowRight'] && !keyTimers['ArrowRight']) {
    if (valid(current.shape, current.x+1, current.y)) current.x++;
    keyTimers['ArrowRight'] = setTimeout(() => { delete keyTimers['ArrowRight']; }, 150);
  }
  if (keys['ArrowDown'] && !keyTimers['ArrowDown']) {
    if (valid(current.shape, current.x, current.y+1)) { current.y++; score++; updateHUD(); }
    else { place(); updateHUD(); }
    keyTimers['ArrowDown'] = setTimeout(() => { delete keyTimers['ArrowDown']; }, 60);
  }
  if (Date.now() - lastDrop > interval) {
    if (valid(current.shape, current.x, current.y+1)) current.y++;
    else place();
    lastDrop = Date.now();
    updateHUD();
  }
}

function drawBlock(ctx, x, y, color, alpha=1) {
  const px = x*BLOCK, py = y*BLOCK;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.fillRect(px+1, py+1, BLOCK-2, BLOCK-2);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(px+1, py+1, BLOCK-2, 4);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(px+1, py+BLOCK-5, BLOCK-2, 4);
  ctx.globalAlpha = 1;
}

function ghostY() {
  let gy = current.y;
  while (valid(current.shape, current.x, gy+1)) gy++;
  return gy;
}

function draw() {
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Grid lines
  ctx.strokeStyle = '#111124';
  ctx.lineWidth = 0.5;
  for (let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*BLOCK,0);ctx.lineTo(x*BLOCK,canvas.height);ctx.stroke();}
  for (let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*BLOCK);ctx.lineTo(canvas.width,y*BLOCK);ctx.stroke();}
  // Board
  board.forEach((row, r) => row.forEach((c, col) => { if (c) drawBlock(ctx, col, r, c); }));
  // Ghost
  if (state === 'playing') {
    const gy = ghostY();
    current.shape.forEach((row, r) => row.forEach((v, c) => {
      if (v) drawBlock(ctx, current.x+c, gy+r, current.color, 0.2);
    }));
    // Current piece
    current.shape.forEach((row, r) => row.forEach((v, c) => {
      if (v) drawBlock(ctx, current.x+c, current.y+r, current.color);
    }));
  }
  // Overlays
  if (state === 'gameover') {
    ctx.fillStyle = 'rgba(10,10,20,0.85)';
    ctx.fillRect(0, ROWS*BLOCK/2-60, COLS*BLOCK, 120);
    ctx.fillStyle = '#f43f5e';
    ctx.font = 'bold 22px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', COLS*BLOCK/2, ROWS*BLOCK/2-20);
    ctx.fillStyle = '#a0a0c0';
    ctx.font = '13px Segoe UI';
    ctx.fillText('Press Enter or Space', COLS*BLOCK/2, ROWS*BLOCK/2+10);
    ctx.fillText('to play again', COLS*BLOCK/2, ROWS*BLOCK/2+28);
  } else if (state === 'paused') {
    ctx.fillStyle = 'rgba(10,10,20,0.75)';
    ctx.fillRect(0, 0, COLS*BLOCK, ROWS*BLOCK);
    ctx.fillStyle = '#c084fc';
    ctx.font = 'bold 26px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', COLS*BLOCK/2, ROWS*BLOCK/2);
  } else if (state === 'idle') {
    ctx.fillStyle = 'rgba(10,10,20,0.85)';
    ctx.fillRect(0, ROWS*BLOCK/2-60, COLS*BLOCK, 120);
    ctx.fillStyle = '#c084fc';
    ctx.font = 'bold 22px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('TETRIS', COLS*BLOCK/2, ROWS*BLOCK/2-20);
    ctx.fillStyle = '#a0a0c0';
    ctx.font = '13px Segoe UI';
    ctx.fillText('Press Enter to start', COLS*BLOCK/2, ROWS*BLOCK/2+10);
  }
  // Next piece
  nctx.fillStyle = '#0a0a14';
  nctx.fillRect(0, 0, 80, 80);
  const ns = next.shape;
  const offX = Math.floor((4 - ns[0].length)/2);
  const offY = Math.floor((4 - ns.length)/2);
  ns.forEach((row, r) => row.forEach((v, c) => {
    if (v) {
      const px = (offX+c)*20, py = (offY+r)*20;
      nctx.fillStyle = next.color;
      nctx.fillRect(px+1, py+1, 18, 18);
      nctx.fillStyle = 'rgba(255,255,255,0.2)';
      nctx.fillRect(px+1, py+1, 18, 4);
    }
  }));
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  document.getElementById('lines').textContent = lines;
}

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key)) e.preventDefault();
  if (e.key === 'ArrowUp') {
    const rot = rotate(current.shape);
    if (valid(rot, current.x, current.y)) current.shape = rot;
    else if (valid(rot, current.x+1, current.y)) { current.shape = rot; current.x++; }
    else if (valid(rot, current.x-1, current.y)) { current.shape = rot; current.x--; }
  }
  if (e.key === ' ') { if (state === 'playing') hardDrop(); else if (state === 'idle' || state === 'gameover') newGame(); }
  if (e.key === 'Enter') { if (state === 'idle' || state === 'gameover') newGame(); }
  if (e.key === 'p' || e.key === 'P') {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') { state = 'playing'; lastDrop = Date.now(); }
  }
});
document.addEventListener('keyup', e => { keys[e.key] = false; delete keyTimers[e.key]; });

function loop() {
  raf = requestAnimationFrame(loop);
  tick();
  draw();
}

state = 'idle';
current = newPiece();
next = newPiece();
board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
loop();
</script>
</body>
</html>
