<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #00ff00;
    user-select: none;
  }
  #hud { display: flex; gap: 40px; margin-bottom: 8px; font-size: 1rem; }
  #hud span { color: #fff; }
  canvas {
    border: 1px solid #00ff0040;
    background: #000;
    box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
  }
  #ctrl { margin-top: 10px; font-size: 0.75rem; color: #444; }
</style>
</head>
<body>
<div id="hud">SCORE: <span id="score">0</span> &nbsp; HIGH: <span id="hi">0</span> &nbsp; LIVES: <span id="lives">3</span> &nbsp; WAVE: <span id="wave">1</span></div>
<canvas id="c" width="480" height="520"></canvas>
<div id="ctrl">← → to move | SPACE to shoot | Click to start</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 480, H = 520;

let state = 'title', score = 0, hi = 0, lives = 3, wave = 1;
let player, bullets, invaders, invBullets, barriers, raf;
let invDir = 1, invSpeed, invDropY = 0, lastShot = 0, lastInvShot = 0;
let keys = {};

const PLAYER_W = 32, PLAYER_H = 18;
const BULLET_W = 3, BULLET_H = 12;
const INV_W = 28, INV_H = 22, INV_COLS = 11, INV_ROWS = 5;
const INV_PAD_X = 10, INV_PAD_Y = 14;

function initGame() {
  player = { x: W/2 - PLAYER_W/2, y: H - 50, w: PLAYER_W, h: PLAYER_H };
  bullets = [];
  invBullets = [];
  invDir = 1;
  invSpeed = 0.5 + wave * 0.2;
  invDropY = 0;
  spawnInvaders();
  spawnBarriers();
  state = 'playing';
  updateHUD();
}

function spawnInvaders() {
  invaders = [];
  const startX = (W - INV_COLS * (INV_W + INV_PAD_X)) / 2;
  const startY = 60;
  for (let r = 0; r < INV_ROWS; r++) {
    for (let c = 0; c < INV_COLS; c++) {
      invaders.push({
        x: startX + c * (INV_W + INV_PAD_X),
        y: startY + r * (INV_H + INV_PAD_Y),
        type: r < 1 ? 2 : r < 3 ? 1 : 0,
        alive: true,
        anim: 0
      });
    }
  }
}

function spawnBarriers() {
  barriers = [];
  const bw = 48, bh = 28, bpieces = [];
  for (let b = 0; b < 4; b++) {
    const bx = 40 + b * 100;
    const by = H - 110;
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 6; c++)
        if (!(r === 0 && (c === 0 || c === 5)) && !(r === 3 && (c === 2 || c === 3)))
          barriers.push({ x: bx + c*8, y: by + r*8, w: 8, h: 8, hp: 3 });
  }
}

let animTick = 0;
function tick() {
  if (state !== 'playing') return;
  animTick++;

  // Player movement
  if (keys['ArrowLeft'] || keys['a']) player.x = Math.max(0, player.x - 4);
  if (keys['ArrowRight'] || keys['d']) player.x = Math.min(W - player.w, player.x + 4);
  if ((keys[' '] || keys['ArrowUp']) && Date.now() - lastShot > 400) {
    bullets.push({ x: player.x + player.w/2 - 1.5, y: player.y, w: BULLET_W, h: BULLET_H, vy: -10 });
    lastShot = Date.now();
  }

  // Player bullets
  bullets = bullets.filter(b => {
    b.y += b.vy;
    if (b.y < 0) return false;
    for (const bar of barriers) {
      if (bar.hp > 0 && collide(b, bar)) { bar.hp--; return false; }
    }
    for (const inv of invaders) {
      if (inv.alive && collide(b, { x: inv.x, y: inv.y, w: INV_W, h: INV_H })) {
        inv.alive = false;
        score += (inv.type + 1) * 10;
        updateHUD();
        return false;
      }
    }
    return true;
  });

  // Invader movement
  const alive = invaders.filter(i => i.alive);
  if (!alive.length) { wave++; setTimeout(() => initGame(), 1200); return; }
  const minX = Math.min(...alive.map(i => i.x));
  const maxX = Math.max(...alive.map(i => i.x + INV_W));
  let drop = false;
  if (maxX + invSpeed * invDir > W - 5) { invDir = -1; drop = true; }
  if (minX + invSpeed * invDir < 5) { invDir = 1; drop = true; }
  invaders.forEach(inv => {
    if (!inv.alive) return;
    inv.x += invSpeed * invDir;
    if (drop) inv.y += 16;
    if (animTick % 20 === 0) inv.anim = 1 - inv.anim;
    if (inv.y + INV_H > player.y) { gameover(); return; }
  });

  // Invader shooting
  if (Date.now() - lastInvShot > Math.max(300, 800 - wave * 50)) {
    const cols = {};
    alive.forEach(inv => { const c = Math.round(inv.x); if (!cols[c] || inv.y > cols[c].y) cols[c] = inv; });
    const shooters = Object.values(cols);
    if (shooters.length) {
      const s = shooters[Math.floor(Math.random() * shooters.length)];
      invBullets.push({ x: s.x + INV_W/2 - 2, y: s.y + INV_H, w: 4, h: 14, vy: 5 });
      lastInvShot = Date.now();
    }
  }

  // Invader bullets
  invBullets = invBullets.filter(b => {
    b.y += b.vy;
    if (b.y > H) return false;
    for (const bar of barriers) {
      if (bar.hp > 0 && collide(b, bar)) { bar.hp--; return false; }
    }
    if (collide(b, player)) { hitPlayer(); return false; }
    return true;
  });
}

function hitPlayer() {
  lives--;
  updateHUD();
  if (lives <= 0) gameover();
  else { player.x = W/2 - PLAYER_W/2; }
}

function gameover() {
  state = 'gameover';
  if (score > hi) hi = score;
  updateHUD();
}

function collide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// Draw functions
function drawInvader(inv) {
  const t = inv.type, x = inv.x, y = inv.y, a = inv.anim;
  ctx.fillStyle = t === 2 ? '#ff6666' : t === 1 ? '#ffaa00' : '#00ff00';
  ctx.shadowBlur = 6;
  ctx.shadowColor = ctx.fillStyle;
  if (t === 0) { // crab
    if (!a) {
      // body
      ctx.fillRect(x+4,y+2,20,14); ctx.fillRect(x+8,y+16,12,4);
      ctx.fillRect(x,y+6,4,6); ctx.fillRect(x+24,y+6,4,6);
      ctx.fillRect(x+2,y+14,4,4); ctx.fillRect(x+22,y+14,4,4);
      // eyes
      ctx.fillStyle='#000'; ctx.fillRect(x+8,y+5,4,4); ctx.fillRect(x+16,y+5,4,4);
    } else {
      ctx.fillRect(x+4,y+4,20,14); ctx.fillRect(x+8,y+18,12,2);
      ctx.fillRect(x+2,y+4,4,6); ctx.fillRect(x+22,y+4,4,6);
      ctx.fillRect(x+0,y+12,4,4); ctx.fillRect(x+24,y+12,4,4);
      ctx.fillStyle='#000'; ctx.fillRect(x+8,y+7,4,4); ctx.fillRect(x+16,y+7,4,4);
    }
  } else if (t === 1) { // squid
    ctx.fillRect(x+4,y+2,20,14); ctx.fillRect(x+2,y+14,6,4); ctx.fillRect(x+12,y+14,4,4); ctx.fillRect(x+20,y+14,6,4);
    if (!a) { ctx.fillRect(x+0,y+6,2,4); ctx.fillRect(x+26,y+6,2,4); }
    else { ctx.fillRect(x+0,y+10,2,4); ctx.fillRect(x+26,y+10,2,4); }
    ctx.fillStyle='#000'; ctx.fillRect(x+8,y+5,4,4); ctx.fillRect(x+16,y+5,4,4);
  } else { // saucer
    ctx.beginPath(); ctx.ellipse(x+INV_W/2,y+10,12,7,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#88aaff'; ctx.beginPath(); ctx.ellipse(x+INV_W/2,y+6,7,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.fillRect(x+9,y+8,3,3); ctx.fillRect(x+16,y+8,3,3);
  }
  ctx.shadowBlur = 0;
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);
  // Stars
  if (!draw.stars) { draw.stars = Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5,b:Math.random()})); }
  draw.stars.forEach(s => {
    ctx.fillStyle = `rgba(255,255,255,${0.3+s.b*0.5})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  });

  if (state === 'title') {
    ctx.fillStyle = '#00ff00';
    ctx.font = 'bold 36px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('SPACE INVADERS', W/2, H/2 - 40);
    ctx.font = '16px Courier New';
    ctx.fillStyle = '#aaa';
    ctx.fillText('← → to move | SPACE to shoot', W/2, H/2 + 10);
    ctx.fillStyle = '#00ff00';
    ctx.font = '20px Courier New';
    ctx.fillText('[ CLICK TO START ]', W/2, H/2 + 50);
    return;
  }
  if (state === 'gameover') {
    ctx.fillStyle = '#ff3333';
    ctx.font = 'bold 40px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2 - 30);
    ctx.fillStyle = '#aaa';
    ctx.font = '16px Courier New';
    ctx.fillText(`SCORE: ${score}   HIGH: ${hi}`, W/2, H/2 + 10);
    ctx.fillStyle = '#00ff00';
    ctx.font = '18px Courier New';
    ctx.fillText('[ CLICK TO PLAY AGAIN ]', W/2, H/2 + 50);
    return;
  }

  // Barriers
  barriers.forEach(b => {
    if (b.hp <= 0) return;
    ctx.fillStyle = `rgba(0,255,0,${b.hp/3})`;
    ctx.fillRect(b.x, b.y, b.w, b.h);
  });

  // Invaders
  invaders.forEach(inv => { if (inv.alive) drawInvader(inv); });

  // Player
  ctx.fillStyle = '#7c3aed';
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#7c3aed';
  ctx.fillRect(player.x + 12, player.y, 8, 6);
  ctx.fillRect(player.x + 4, player.y + 6, 24, 12);
  ctx.shadowBlur = 0;

  // Bullets
  ctx.fillStyle = '#c084fc';
  ctx.shadowBlur = 6; ctx.shadowColor = '#c084fc';
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#ff4444';
  ctx.shadowBlur = 6; ctx.shadowColor = '#ff4444';
  invBullets.forEach(b => { ctx.fillRect(b.x, b.y, 3, 8); ctx.fillRect(b.x+1, b.y+3, 2, 4); });
  ctx.shadowBlur = 0;

  // Ground line
  ctx.strokeStyle = '#00ff0040';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, H-18); ctx.lineTo(W, H-18); ctx.stroke();
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('hi').textContent = hi;
  document.getElementById('lives').textContent = lives;
  document.getElementById('wave').textContent = wave;
}

canvas.addEventListener('click', () => {
  if (state === 'title' || state === 'gameover') {
    score = 0; lives = 3; wave = 1; updateHUD();
    initGame();
  } else launch();
});

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') e.preventDefault();
  if ((state === 'title' || state === 'gameover') && e.key === ' ') {
    score = 0; lives = 3; wave = 1; updateHUD();
    initGame();
  }
});
document.addEventListener('keyup', e => keys[e.key] = false);

function launch() {
  if (state === 'playing' && Date.now() - lastShot > 400) {
    bullets.push({ x: player.x + player.w/2 - 1.5, y: player.y, w: BULLET_W, h: BULLET_H, vy: -10 });
    lastShot = Date.now();
  }
}

function loop() {
  tick();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
