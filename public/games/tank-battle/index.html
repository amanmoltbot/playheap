<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tank Battle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f0f0f; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = Math.min(window.innerWidth, 700);
const H = Math.min(window.innerHeight, 500);
canvas.width = W; canvas.height = H;

const STATE = { MENU: 0, PLAY: 1, OVER: 2 };
let state = STATE.MENU;
let keys = {}, tanks, bullets, particles, walls, frameCount, winner;

// Walls (normalized)
const WALL_DEFS = [
  [0.3, 0.2, 0.08, 0.25],
  [0.62, 0.2, 0.08, 0.25],
  [0.46, 0.42, 0.08, 0.16],
  [0.15, 0.6, 0.08, 0.2],
  [0.77, 0.6, 0.08, 0.2],
  [0.35, 0.72, 0.3, 0.06],
];

function initGame() {
  tanks = [
    { x: W*0.1, y: H/2, angle: 0, turretAngle: 0, hp: 5, maxHp: 5, color: '#8b5cf6', cooldown: 0, id: 1, score: 0 },
    { x: W*0.9, y: H/2, angle: Math.PI, turretAngle: Math.PI, hp: 5, maxHp: 5, color: '#f97316', cooldown: 0, id: 2, score: 0 }
  ];
  bullets = []; particles = []; frameCount = 0; winner = null;
  walls = WALL_DEFS.map(([x,y,w,h]) => ({ x:x*W, y:y*H, w:w*W, h:h*H }));
  state = STATE.PLAY;
}

function spawnParticles(x, y, color, n=12) {
  for (let i=0; i<n; i++) {
    const a=Math.random()*Math.PI*2, s=2+Math.random()*5;
    particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:25, color });
  }
}

function rectCircle(rx,ry,rw,rh, cx,cy,cr) {
  const nearX = Math.max(rx, Math.min(cx, rx+rw));
  const nearY = Math.max(ry, Math.min(cy, ry+rh));
  const dx=cx-nearX, dy=cy-nearY;
  return dx*dx+dy*dy < cr*cr;
}

function drawTank(t) {
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.rotate(t.angle);
  // Body
  ctx.fillStyle = t.hp <= 0 ? '#444' : t.color;
  ctx.shadowColor = t.color; ctx.shadowBlur = t.hp > 0 ? 12 : 0;
  ctx.beginPath(); ctx.roundRect(-20,-15,40,30,4); ctx.fill();
  ctx.shadowBlur = 0;
  // Treads
  ctx.fillStyle = '#333';
  ctx.fillRect(-20,-18,40,6); ctx.fillRect(-20,12,40,6);
  // Tread marks
  ctx.strokeStyle = '#555'; ctx.lineWidth=1;
  for (let i=-18; i<20; i+=5) {
    ctx.beginPath(); ctx.moveTo(i,-18); ctx.lineTo(i,-12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(i,12); ctx.lineTo(i,18); ctx.stroke();
  }
  ctx.restore();
  // Turret (separate rotation)
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.rotate(t.turretAngle);
  ctx.fillStyle = t.hp <= 0 ? '#333' : t.color;
  ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#aaa';
  ctx.fillRect(8,-4,22,8); // Barrel
  ctx.restore();
  // HP bar
  if (t.hp > 0) {
    ctx.fillStyle = '#333'; ctx.fillRect(t.x-20,t.y-26,40,5);
    ctx.fillStyle = t.hp > 2 ? '#4ade80' : '#ff4444';
    ctx.fillRect(t.x-20,t.y-26,40*(t.hp/t.maxHp),5);
  }
}

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (state !== STATE.PLAY && (e.key === 'Enter' || e.key === ' ')) initGame();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('click', () => { if (state !== STATE.PLAY) initGame(); });

function updateTank(t, up, down, left, right, shoot) {
  if (t.hp <= 0) return;
  const speed = 2.5;
  const prev = { x: t.x, y: t.y };

  if (up) { t.x += Math.cos(t.angle)*speed; t.y += Math.sin(t.angle)*speed; }
  if (down) { t.x -= Math.cos(t.angle)*speed; t.y -= Math.sin(t.angle)*speed; }
  if (left) t.angle -= 0.05;
  if (right) t.angle += 0.05;

  // Turret auto-aims toward center for P1, away for P2 (just follows body for simplicity)
  t.turretAngle = t.angle;

  // Boundary
  t.x = Math.max(20, Math.min(W-20, t.x));
  t.y = Math.max(20, Math.min(H-20, t.y));

  // Wall collision
  walls.forEach(w => {
    if (rectCircle(w.x, w.y, w.w, w.h, t.x, t.y, 20)) {
      t.x = prev.x; t.y = prev.y;
    }
  });

  // Shoot
  if (shoot && t.cooldown <= 0) {
    t.cooldown = 30;
    bullets.push({
      x: t.x + Math.cos(t.angle)*30,
      y: t.y + Math.sin(t.angle)*30,
      vx: Math.cos(t.angle)*9,
      vy: Math.sin(t.angle)*9,
      owner: t.id, life: 80,
      color: t.color
    });
  }
  if (t.cooldown > 0) t.cooldown--;
}

function loop() {
  requestAnimationFrame(loop);
  ctx.fillStyle = '#111820';
  ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x=0; x<W; x+=30) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0; y<H; y+=30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  if (state === STATE.MENU) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#fbbf24'; ctx.font = `bold ${W*0.1}px sans-serif`;
    ctx.textAlign = 'center'; ctx.fillText('TANK BATTLE', W/2, H*0.3);
    ctx.fillStyle = '#8b5cf6'; ctx.font = `${W*0.045}px sans-serif`;
    ctx.fillText('Player 1: WASD move, Space = shoot', W/2, H*0.48);
    ctx.fillStyle = '#f97316';
    ctx.fillText('Player 2: Arrow keys, Enter = shoot', W/2, H*0.57);
    ctx.fillStyle = '#fbbf24'; ctx.font = `bold ${W*0.065}px sans-serif`;
    ctx.fillText('CLICK TO START', W/2, H*0.76);
    return;
  }

  if (state === STATE.OVER) {
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = winner === 1 ? '#8b5cf6' : '#f97316';
    ctx.font = `bold ${W*0.1}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(`PLAYER ${winner} WINS!`, W/2, H*0.38);
    ctx.fillStyle = '#fff'; ctx.font = `bold ${W*0.065}px sans-serif`;
    ctx.fillText('CLICK TO RESTART', W/2, H*0.62);
    particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vx*=0.9; p.vy*=0.9; p.life--; });
    particles = particles.filter(p=>p.life>0);
    particles.forEach(p => { ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fillStyle=p.color; ctx.globalAlpha=p.life/25; ctx.fill(); ctx.globalAlpha=1; });
    return;
  }

  frameCount++;

  // Controls
  updateTank(tanks[0],
    keys['w']||keys['W'], keys['s']||keys['S'],
    keys['a']||keys['A'], keys['d']||keys['D'],
    keys[' ']
  );
  updateTank(tanks[1],
    keys['ArrowUp'], keys['ArrowDown'],
    keys['ArrowLeft'], keys['ArrowRight'],
    keys['Enter']
  );

  // Bullets
  bullets.forEach(b => {
    b.x += b.vx; b.y += b.vy; b.life--;
    // Wall bounce
    walls.forEach(w => {
      if (b.x > w.x && b.x < w.x+w.w && b.y > w.y && b.y < w.y+w.h) {
        b.vx *= -1; b.vy *= -1; b.life -= 10;
        spawnParticles(b.x, b.y, '#fff', 4);
      }
    });
    // Boundary bounce
    if (b.x < 0 || b.x > W) { b.vx *= -1; b.life -= 20; }
    if (b.y < 0 || b.y > H) { b.vy *= -1; b.life -= 20; }
    // Hit tanks
    tanks.forEach(t => {
      if (t.id === b.owner || t.hp <= 0) return;
      const dist = Math.sqrt((b.x-t.x)**2+(b.y-t.y)**2);
      if (dist < 24) {
        t.hp--; b.life = 0;
        spawnParticles(t.x, t.y, t.color, 10);
        if (t.hp <= 0) { winner = b.owner; state = STATE.OVER; spawnParticles(t.x, t.y, t.color, 20); }
      }
    });
  });
  bullets = bullets.filter(b=>b.life>0);

  // Draw walls
  walls.forEach(w => {
    ctx.fillStyle = '#2a3a2a';
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 2;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeRect(w.x, w.y, w.w, w.h);
  });

  // Draw tanks
  tanks.forEach(t => drawTank(t));

  // Draw bullets
  bullets.forEach(b => {
    ctx.beginPath(); ctx.arc(b.x,b.y,5,0,Math.PI*2);
    ctx.fillStyle = b.color; ctx.shadowColor = b.color; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0;
  });

  // Particles
  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vx*=0.9; p.vy*=0.9; p.life--; });
  particles = particles.filter(p=>p.life>0);
  particles.forEach(p => { ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fillStyle=p.color; ctx.globalAlpha=p.life/25; ctx.fill(); ctx.globalAlpha=1; });

  // HUD
  ctx.fillStyle = '#8b5cf6'; ctx.font = `bold ${W*0.04}px sans-serif`;
  ctx.textAlign = 'left'; ctx.fillText('P1: WASD + Space', 10, 22);
  ctx.fillStyle = '#f97316'; ctx.textAlign = 'right';
  ctx.fillText('P2: Arrows + Enter', W-10, 22);
}

loop();
</script>
</body>
</html>
