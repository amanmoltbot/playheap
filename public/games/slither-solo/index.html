<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slither Solo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a2a2a; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; cursor: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = Math.min(window.innerWidth, 700);
const H = Math.min(window.innerHeight, 700);
canvas.width = W; canvas.height = H;

const STATE = { MENU: 0, PLAY: 1, OVER: 2 };
let state = STATE.MENU;
let player, aiSnakes, food, particles, score, frameCount, mouseX, mouseY;

const SEGMENT_SPACING = 8;
const SNAKE_COLORS = ['#f97316','#22c55e','#3b82f6','#ec4899','#eab308','#ef4444'];

function initGame() {
  player = {
    x: W/2, y: H/2,
    angle: 0,
    segments: [],
    speed: 3.2,
    color: '#8b5cf6',
    length: 20,
    growing: 10
  };
  // Init segments
  for (let i=0; i<20; i++) {
    player.segments.push({ x: W/2 - i*SEGMENT_SPACING, y: H/2 });
  }
  aiSnakes = [];
  food = [];
  particles = [];
  score = 0; frameCount = 0;
  mouseX = W/2; mouseY = H/2;

  // Spawn AI snakes
  for (let i=0; i<4; i++) spawnAI();
  // Spawn food
  for (let i=0; i<60; i++) spawnFood();

  state = STATE.PLAY;
}

function spawnFood() {
  food.push({
    x: 20+Math.random()*(W-40),
    y: 20+Math.random()*(H-40),
    r: 5+Math.random()*4,
    color: SNAKE_COLORS[Math.floor(Math.random()*SNAKE_COLORS.length)],
    pulse: Math.random()*Math.PI*2
  });
}

function spawnAI(large=false) {
  const color = SNAKE_COLORS[Math.floor(Math.random()*SNAKE_COLORS.length)];
  const len = large ? 40+Math.floor(Math.random()*30) : 15+Math.floor(Math.random()*25);
  const sx = Math.random()*W, sy = Math.random()*H;
  const angle = Math.random()*Math.PI*2;
  const segs = [];
  for (let i=0; i<len; i++) {
    segs.push({ x: sx-Math.cos(angle)*i*SEGMENT_SPACING, y: sy-Math.sin(angle)*i*SEGMENT_SPACING });
  }
  aiSnakes.push({ segs, color, angle, speed: 1.5+Math.random()*1.5, len, turnTimer: 0, dead: false });
}

function spawnParticles(x, y, color, n) {
  for (let i=0; i<n; i++) {
    const a=Math.random()*Math.PI*2, s=1+Math.random()*4;
    particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:25, color });
  }
}

function drawSnake(segs, color, headR) {
  if (segs.length < 2) return;
  // Body
  for (let i=segs.length-1; i>=0; i--) {
    const r = headR * (0.5 + 0.5 * (1 - i/segs.length));
    ctx.beginPath();
    ctx.arc(segs[i].x, segs[i].y, r, 0, Math.PI*2);
    const alpha = 0.7 + 0.3*(1-i/segs.length);
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  // Head
  const head = segs[0];
  ctx.beginPath();
  ctx.arc(head.x, head.y, headR, 0, Math.PI*2);
  ctx.fillStyle = color;
  ctx.shadowColor = color; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0;
  // Eyes
  const eyeAngle = segs.length > 1 ? Math.atan2(segs[0].y-segs[1].y, segs[0].x-segs[1].x) : 0;
  const eyeR = headR*0.22;
  const eyeOff = headR*0.45;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(head.x+Math.cos(eyeAngle)*eyeOff-Math.sin(eyeAngle)*headR*0.25, head.y+Math.sin(eyeAngle)*eyeOff+Math.cos(eyeAngle)*headR*0.25, eyeR, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(head.x+Math.cos(eyeAngle)*eyeOff+Math.sin(eyeAngle)*headR*0.25, head.y+Math.sin(eyeAngle)*eyeOff-Math.cos(eyeAngle)*headR*0.25, eyeR, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(head.x+Math.cos(eyeAngle)*eyeOff*1.1-Math.sin(eyeAngle)*headR*0.25, head.y+Math.sin(eyeAngle)*eyeOff*1.1+Math.cos(eyeAngle)*headR*0.25, eyeR*0.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(head.x+Math.cos(eyeAngle)*eyeOff*1.1+Math.sin(eyeAngle)*headR*0.25, head.y+Math.sin(eyeAngle)*eyeOff*1.1-Math.cos(eyeAngle)*headR*0.25, eyeR*0.5, 0, Math.PI*2); ctx.fill();
}

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const sc = canvas.width/r.width;
  mouseX = (e.clientX-r.left)*sc;
  mouseY = (e.clientY-r.top)*sc;
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const sc = canvas.width/r.width;
  mouseX = (e.touches[0].clientX-r.left)*sc;
  mouseY = (e.touches[0].clientY-r.top)*sc;
}, { passive: false });
canvas.addEventListener('click', () => { if (state !== STATE.PLAY) initGame(); });
canvas.addEventListener('touchend', e => { e.preventDefault(); if (state !== STATE.PLAY) initGame(); });

function loop() {
  requestAnimationFrame(loop);
  ctx.fillStyle = '#0a2a2a';
  ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = 'rgba(45,212,191,0.05)';
  ctx.lineWidth = 1;
  for (let x=0; x<W; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0; y<H; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  if (state === STATE.MENU) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#8b5cf6'; ctx.font = `bold ${W*0.1}px sans-serif`;
    ctx.textAlign = 'center'; ctx.fillText('SLITHER', W/2, H*0.3);
    ctx.fillText('SOLO', W/2, H*0.42);
    ctx.fillStyle = '#aaa'; ctx.font = `${W*0.047}px sans-serif`;
    ctx.fillText('Move mouse to steer', W/2, H*0.57);
    ctx.fillText('Eat food to grow • Avoid other snakes', W/2, H*0.63);
    ctx.fillStyle = '#8b5cf6'; ctx.font = `bold ${W*0.065}px sans-serif`;
    ctx.fillText('CLICK TO START', W/2, H*0.78);
    return;
  }

  if (state === STATE.OVER) {
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#ff4444'; ctx.font = `bold ${W*0.1}px sans-serif`;
    ctx.textAlign = 'center'; ctx.fillText('YOU DIED!', W/2, H*0.35);
    ctx.fillStyle = '#fff'; ctx.font = `bold ${W*0.08}px sans-serif`;
    ctx.fillText(`Score: ${score}`, W/2, H*0.5);
    ctx.fillStyle = '#8b5cf6'; ctx.font = `bold ${W*0.065}px sans-serif`;
    ctx.fillText('CLICK TO RESTART', W/2, H*0.67);
    particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vx*=0.9; p.vy*=0.9; p.life--; });
    particles = particles.filter(p=>p.life>0);
    particles.forEach(p => { ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fillStyle=p.color; ctx.globalAlpha=p.life/25; ctx.fill(); ctx.globalAlpha=1; });
    return;
  }

  frameCount++;

  // Steer player toward mouse
  const dx = mouseX - player.x, dy = mouseY - player.y;
  if (Math.sqrt(dx*dx+dy*dy) > 5) {
    player.angle = Math.atan2(dy, dx);
  }
  player.x += Math.cos(player.angle)*player.speed;
  player.y += Math.sin(player.angle)*player.speed;

  // Wrap around edges
  if (player.x < 0) player.x = W;
  if (player.x > W) player.x = 0;
  if (player.y < 0) player.y = H;
  if (player.y > H) player.y = 0;

  // Update segments
  player.segments.unshift({ x: player.x, y: player.y });
  const maxLen = 20 + player.length;
  while (player.segments.length > maxLen) player.segments.pop();

  // Eat food
  food.forEach(f => {
    const dist = Math.sqrt((f.x-player.x)**2+(f.y-player.y)**2);
    if (dist < 10+f.r) {
      f.eaten = true; player.length += 2; score += Math.ceil(f.r);
      spawnParticles(f.x, f.y, f.color, 6);
    }
  });
  food = food.filter(f=>!f.eaten);
  while (food.length < 60) spawnFood();

  // Update AI snakes
  aiSnakes.forEach(ai => {
    ai.turnTimer--;
    if (ai.turnTimer <= 0) {
      ai.angle += (Math.random()-0.5)*1.5;
      ai.turnTimer = 30+Math.random()*90;
    }
    // Seek food
    let closest = null, cDist = 300;
    food.forEach(f => {
      const d = Math.sqrt((f.x-ai.segs[0].x)**2+(f.y-ai.segs[0].y)**2);
      if (d < cDist) { closest = f; cDist = d; }
    });
    if (closest && cDist < 150) {
      const ta = Math.atan2(closest.y-ai.segs[0].y, closest.x-ai.segs[0].x);
      const diff = ((ta - ai.angle + 3*Math.PI) % (2*Math.PI)) - Math.PI;
      ai.angle += Math.sign(diff)*0.08;
    }

    const hx = ai.segs[0].x + Math.cos(ai.angle)*ai.speed;
    const hy = ai.segs[0].y + Math.sin(ai.angle)*ai.speed;
    // Wrap
    ai.segs.unshift({ x: ((hx%W)+W)%W, y: ((hy%H)+H)%H });
    while (ai.segs.length > ai.len) ai.segs.pop();

    // Eat food
    food.forEach(f => {
      const dist = Math.sqrt((f.x-ai.segs[0].x)**2+(f.y-ai.segs[0].y)**2);
      if (dist < 10+f.r) { f.eaten = true; ai.len += 1; }
    });

    // Check if player head hits AI body
    ai.segs.forEach((s, i) => {
      if (i < 3) return;
      const dist = Math.sqrt((s.x-player.x)**2+(s.y-player.y)**2);
      if (dist < 10) {
        spawnParticles(player.x, player.y, player.color, 20);
        state = STATE.OVER;
      }
    });
    // Check if AI head hits player body
    player.segments.forEach((s, i) => {
      if (i < 3) return;
      const dist = Math.sqrt((s.x-ai.segs[0].x)**2+(s.y-ai.segs[0].y)**2);
      if (dist < 10) {
        ai.dead = true;
        // Drop food from dead snake
        ai.segs.forEach((seg, si) => {
          if (si % 4 === 0) food.push({ x:seg.x, y:seg.y, r:6, color:ai.color, pulse:0 });
        });
        spawnParticles(ai.segs[0].x, ai.segs[0].y, ai.color, 15);
        score += ai.len;
        spawnAI(true);
      }
    });
  });
  aiSnakes = aiSnakes.filter(ai=>!ai.dead);
  while (aiSnakes.length < 4) spawnAI();

  // Draw food
  food.forEach(f => {
    f.pulse += 0.1;
    const pr = f.r + Math.sin(f.pulse)*1.5;
    ctx.beginPath(); ctx.arc(f.x, f.y, pr, 0, Math.PI*2);
    ctx.fillStyle = f.color; ctx.shadowColor=f.color; ctx.shadowBlur=8; ctx.fill(); ctx.shadowBlur=0;
  });

  // Draw AI snakes
  aiSnakes.forEach(ai => {
    const headR = 8 + ai.len*0.1;
    drawSnake(ai.segs, ai.color, Math.min(headR, 18));
  });

  // Draw player snake
  const pHeadR = 8 + (player.length-20)*0.15;
  drawSnake(player.segments, player.color, Math.min(pHeadR, 22));

  // Particles
  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vx*=0.9; p.vy*=0.9; p.life--; });
  particles = particles.filter(p=>p.life>0);
  particles.forEach(p => { ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fillStyle=p.color; ctx.globalAlpha=p.life/25; ctx.fill(); ctx.globalAlpha=1; });

  // HUD
  ctx.fillStyle = '#fff'; ctx.font = `bold ${W*0.045}px sans-serif`;
  ctx.textAlign = 'left'; ctx.fillText(`Score: ${score}`, 12, 30);
  ctx.textAlign = 'right'; ctx.fillText(`Length: ${player.length}`, W-12, 30);
}

loop();
</script>
</body>
</html>
