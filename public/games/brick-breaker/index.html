<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: #e0e0e0;
    user-select: none;
  }
  h1 { font-size: 2rem; color: #7c3aed; margin-bottom: 8px; letter-spacing: 2px; }
  #hud { display: flex; gap: 40px; margin-bottom: 12px; font-size: 0.95rem; color: #a0a0c0; }
  #hud span { color: #c084fc; font-weight: bold; font-size: 1.1rem; }
  canvas {
    border: 2px solid #3b0764;
    border-radius: 8px;
    background: #0a0a14;
    box-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
    cursor: none;
  }
  #controls { margin-top: 12px; color: #666; font-size: 0.8rem; }
</style>
</head>
<body>
<h1>🧱 BREAKOUT</h1>
<div id="hud">Score: <span id="score">0</span> &nbsp;|&nbsp; Lives: <span id="lives">3</span> &nbsp;|&nbsp; Level: <span id="level">1</span></div>
<canvas id="c" width="480" height="520"></canvas>
<div id="controls">Mouse / ← → Keys to move paddle &nbsp;|&nbsp; Click / Space to launch</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const PADDLE_W = 80, PADDLE_H = 12, PADDLE_Y = H - 40;
const BALL_R = 7;
const BRICK_COLS = 10, BRICK_ROWS = 6;
const BRICK_W = W / BRICK_COLS, BRICK_H = 22, BRICK_PAD = 2;
const BRICK_OFFSET_Y = 60;

const COLORS = ['#f43f5e','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6'];

let paddle, ball, bricks, score, lives, level, state, keys = {};

function init(lvl = 1) {
  level = lvl;
  paddle = { x: W/2 - PADDLE_W/2, y: PADDLE_Y, w: PADDLE_W };
  ball = { x: W/2, y: PADDLE_Y - BALL_R - 2, vx: 0, vy: 0, attached: true };
  bricks = [];
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      bricks.push({ x: c * BRICK_W + BRICK_PAD, y: BRICK_OFFSET_Y + r * (BRICK_H + BRICK_PAD), w: BRICK_W - BRICK_PAD*2, h: BRICK_H, color: COLORS[r], hp: r < 2 ? 1 : 1, alive: true });
    }
  }
  if (lvl === 1) { score = 0; lives = 3; }
  state = 'playing';
  updateHUD();
}

function launch() {
  if (!ball.attached) return;
  const angle = -Math.PI/2 + (Math.random()-0.5) * Math.PI/3;
  const spd = 4 + level * 0.5;
  ball.vx = Math.cos(angle) * spd;
  ball.vy = Math.sin(angle) * spd;
  ball.attached = false;
}

function tick() {
  if (state !== 'playing') return;
  // Paddle movement
  if (keys['ArrowLeft'] || keys['a']) paddle.x = Math.max(0, paddle.x - 6);
  if (keys['ArrowRight'] || keys['d']) paddle.x = Math.min(W - paddle.w, paddle.x + 6);
  if (ball.attached) { ball.x = paddle.x + paddle.w/2; return; }
  ball.x += ball.vx;
  ball.y += ball.vy;
  // Walls
  if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx *= -1; }
  if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx *= -1; }
  if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy *= -1; }
  // Paddle collision
  if (ball.y + BALL_R >= paddle.y && ball.y - BALL_R <= paddle.y + PADDLE_H && ball.x >= paddle.x && ball.x <= paddle.x + paddle.w && ball.vy > 0) {
    ball.vy *= -1;
    ball.y = paddle.y - BALL_R;
    const rel = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
    ball.vx = rel * 5;
  }
  // Bottom
  if (ball.y > H + 20) {
    lives--;
    updateHUD();
    if (lives <= 0) { state = 'gameover'; return; }
    ball.attached = true;
    ball.x = paddle.x + paddle.w/2;
    ball.y = PADDLE_Y - BALL_R - 2;
  }
  // Brick collision
  let allDead = true;
  for (const b of bricks) {
    if (!b.alive) continue;
    allDead = false;
    if (ball.x + BALL_R > b.x && ball.x - BALL_R < b.x + b.w && ball.y + BALL_R > b.y && ball.y - BALL_R < b.y + b.h) {
      b.alive = false;
      score += 10 * level;
      updateHUD();
      const overlapX = Math.min(ball.x + BALL_R - b.x, b.x + b.w - (ball.x - BALL_R));
      const overlapY = Math.min(ball.y + BALL_R - b.y, b.y + b.h - (ball.y - BALL_R));
      if (overlapX < overlapY) ball.vx *= -1; else ball.vy *= -1;
      break;
    }
  }
  if (allDead) { state = 'levelcomplete'; }
}

function draw() {
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, 0, W, H);
  // Bricks
  bricks.forEach(b => {
    if (!b.alive) return;
    ctx.fillStyle = b.color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(b.x, b.y, b.w, 4);
  });
  // Paddle
  const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + PADDLE_H);
  grad.addColorStop(0, '#a855f7');
  grad.addColorStop(1, '#7c3aed');
  ctx.fillStyle = grad;
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#7c3aed';
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.w, PADDLE_H, 6);
  ctx.fill();
  ctx.shadowBlur = 0;
  // Ball
  ctx.fillStyle = '#c084fc';
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#c084fc';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // Overlay messages
  if (state === 'start' || (state === 'playing' && ball.attached && score === 0 && lives === 3)) {
    drawMsg('BREAKOUT', 'Click or Space to launch', '#7c3aed');
  } else if (state === 'playing' && ball.attached) {
    ctx.fillStyle = '#a0a0c0';
    ctx.font = '14px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('Click or Space to launch', W/2, H - 10);
  } else if (state === 'gameover') {
    drawMsg('GAME OVER', `Score: ${score} — Click to restart`, '#f43f5e');
  } else if (state === 'levelcomplete') {
    drawMsg(`LEVEL ${level} CLEAR!`, 'Click to continue', '#22c55e');
  }
}

function drawMsg(title, sub, color) {
  ctx.fillStyle = 'rgba(10,10,20,0.85)';
  ctx.fillRect(W/2-180, H/2-70, 360, 140);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.strokeRect(W/2-180, H/2-70, 360, 140);
  ctx.fillStyle = color;
  ctx.font = 'bold 32px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText(title, W/2, H/2-20);
  ctx.fillStyle = '#a0a0c0';
  ctx.font = '16px Segoe UI';
  ctx.fillText(sub, W/2, H/2+20);
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
  document.getElementById('level').textContent = level;
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w/2));
});
canvas.addEventListener('click', handleAction);
// Touch support
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = (e.touches[0].clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w/2));
}, {passive:false});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = (e.touches[0].clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w/2));
  handleAction();
}, {passive:false});
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') { e.preventDefault(); handleAction(); }
});
document.addEventListener('keyup', e => keys[e.key] = false);

function handleAction() {
  if (state === 'playing') launch();
  else if (state === 'gameover') init(1);
  else if (state === 'levelcomplete') init(level + 1);
}

init(1);
state = 'start';

function loop() {
  tick();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
