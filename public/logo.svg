<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" />
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="96" stroke="#7c3aed" stroke-width="2.5" fill="none" opacity="0.6"/>

  <!-- Controller body -->
  <rect x="38" y="72" width="124" height="56" rx="28" fill="url(#bodyGrad)" />

  <!-- D-pad left -->
  <rect x="52" y="90" width="28" height="8" rx="4" fill="#c4b5fd" opacity="0.9"/>
  <rect x="62" y="80" width="8" height="28" rx="4" fill="#c4b5fd" opacity="0.9"/>

  <!-- Action buttons right -->
  <circle cx="140" cy="90" r="6" fill="#f472b6" opacity="0.9"/>
  <circle cx="154" cy="100" r="6" fill="#facc15" opacity="0.9"/>
  <circle cx="140" cy="110" r="6" fill="#34d399" opacity="0.9"/>
  <circle cx="126" cy="100" r="6" fill="#60a5fa" opacity="0.9"/>

  <!-- Center buttons -->
  <rect x="88" y="96" width="10" height="8" rx="4" fill="#6d28d9" opacity="0.9"/>
  <rect x="102" y="96" width="10" height="8" rx="4" fill="#6d28d9" opacity="0.9"/>

  <!-- Shoulder bumpers (top) -->
  <rect x="52" y="60" width="36" height="14" rx="7" fill="url(#shoulderGrad)" opacity="0.85"/>
  <rect x="112" y="60" width="36" height="14" rx="7" fill="url(#shoulderGrad)" opacity="0.85"/>

  <!-- Grip bottom left -->
  <ellipse cx="66" cy="136" rx="18" ry="14" fill="url(#bodyGrad)" opacity="0.8"/>
  <!-- Grip bottom right -->
  <ellipse cx="134" cy="136" rx="18" ry="14" fill="url(#bodyGrad)" opacity="0.8"/>

  <!-- Glow overlay -->
  <circle cx="100" cy="100" r="96" fill="url(#glowGrad)" opacity="0.15"/>

  <defs>
    <radialGradient id="bgGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#1e1040"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="38" y1="72" x2="162" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="shoulderGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
